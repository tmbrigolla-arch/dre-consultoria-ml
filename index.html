<!doctype html>
<html lang="pt-br">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>DRE · Acompanhamento Mercado Livre</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root{--bg:#0f172a;--panel:#ffffff;--line:#e5e8ee;--ink:#1f2733;--muted:#64748b;--accent:#2563eb;--head:#0f172a;--conta:#fff4d6;--cliente:#d9f0dd;--total:#cfe2fb;--up:#16a34a;--down:#dc2626}
  *{box-sizing:border-box}
  body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;margin:0;background:#f1f4f9;color:var(--ink)}
  header{background:var(--head);color:#fff;padding:16px 26px;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:10px}
  header .t h1{margin:0;font-size:19px;letter-spacing:.2px}
  header .t p{margin:4px 0 0;font-size:12.5px;color:#9fb0c9}
  header .actions{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
  select,button,.dd>summary{font:inherit;border-radius:8px;border:1px solid #2c3a52;background:#16213a;color:#fff;padding:8px 12px;cursor:pointer;list-style:none}
  button.reload{background:var(--accent);border-color:var(--accent)}
  button.ghost{background:transparent}
  button:disabled{opacity:.6;cursor:wait}
  .dd{position:relative}
  .dd>summary::-webkit-details-marker{display:none}
  .dd[open]>summary{background:var(--accent);border-color:var(--accent)}
  .dd .menu{position:absolute;right:0;top:42px;z-index:20;background:#fff;color:var(--ink);border:1px solid var(--line);border-radius:10px;box-shadow:0 8px 24px rgba(15,23,42,.18);padding:8px;min-width:170px;max-height:320px;overflow:auto}
  .dd .menu label{display:flex;gap:8px;align-items:center;padding:5px 8px;font-size:13px;border-radius:6px;cursor:pointer;white-space:nowrap}
  .dd .menu label:hover{background:#f1f5fb}
  .tabs{max-width:1280px;margin:0 auto;padding:16px 26px 0;display:flex;gap:8px}
  .tabs button{background:#fff;color:var(--muted);border:1px solid var(--line);border-bottom:none;border-radius:10px 10px 0 0;padding:10px 22px;font-weight:600}
  .tabs button.on{color:var(--ink);background:#fff;border-color:var(--line);box-shadow:0 -2px 0 var(--accent) inset}
  .wrap{max-width:1280px;margin:0 auto;padding:0 26px 60px}
  .cli{background:var(--panel);border:1px solid var(--line);border-radius:0 12px 12px 12px;padding:16px 20px 20px;margin-bottom:22px;box-shadow:0 1px 2px rgba(15,23,42,.04)}
  .cli h2{margin:2px 0 4px;font-size:17px}
  .cli .sub{color:var(--muted);font-size:12.5px;margin-bottom:6px}
  .tag{display:inline-block;font-size:12.5px;font-weight:700;padding:3px 12px;border-radius:6px;margin:16px 0 6px}
  .tag.conta{background:var(--conta)}.tag.cliente{background:var(--cliente)}.tag.total{background:var(--total)}
  table{border-collapse:collapse;width:100%;font-size:13px;margin-bottom:6px;table-layout:fixed}
  th.m,td.m{width:240px;white-space:normal;word-break:break-word}
  th,td{border:1px solid var(--line);padding:7px 12px;text-align:right;white-space:nowrap;vertical-align:top}
  th{background:#f5f7fb;font-weight:600;color:#334155}
  th.m,td.m{text-align:left;background:#fafbfd;font-weight:600}
  td.sub2,th.sub2{color:var(--muted);font-weight:500;padding-left:24px}
  tr:hover td{background:#f8fafc}
  tr:hover td.m{background:#f1f5fb}
  .chg{font-size:11px;margin-right:5px}
  .up{color:var(--up)} .down{color:var(--down)}
  .api{font-size:9px;background:var(--accent);color:#fff;padding:1px 5px;border-radius:3px;margin-left:4px;font-weight:700;letter-spacing:.3px}
  .empty{padding:40px;text-align:center;color:var(--muted)}
  .foot{color:var(--muted);font-size:12px;text-align:center;margin-top:18px;line-height:1.5}
  .pill{display:inline-block;background:#16213a;color:#9fb0c9;font-size:11px;padding:2px 8px;border-radius:20px;margin-left:8px}
  /* login */
  #login{display:none;min-height:100vh;align-items:center;justify-content:center;background:var(--head)}
  .card{background:#fff;border-radius:14px;padding:32px;width:360px;max-width:92vw;box-shadow:0 20px 50px rgba(0,0,0,.35)}
  .card h2{margin:0 0 4px;font-size:20px}
  .card p{margin:0 0 18px;color:var(--muted);font-size:13px}
  .card label{display:block;font-size:12.5px;color:#475569;margin:12px 0 4px}
  .card input{width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:9px;font:inherit}
  .card .btn{width:100%;margin-top:18px;background:var(--accent);color:#fff;border:none;padding:12px;border-radius:9px;font-weight:600;cursor:pointer}
  .card .link{display:block;text-align:center;margin-top:14px;color:var(--accent);font-size:13px;cursor:pointer;background:none;border:none;width:100%}
  .card .err{color:var(--down);font-size:12.5px;margin-top:12px;min-height:16px}
.tagbar{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin:12px 0 2px;padding:8px 10px;background:#fff;border:1px solid var(--line,#e5e7eb);border-radius:10px}.taglbl{font-size:12px;font-weight:600;color:#666;margin:0 2px 0 6px}.tagbar .chip{font:inherit;font-size:12px;line-height:1.4;padding:3px 10px;border:1px solid var(--line,#d0d5dd);border-radius:999px;background:#f3f4f6;color:#333;cursor:pointer}.tagbar .chip.c{background:#eef2ff}.tagbar .chip.on{background:#1F4E79;color:#fff;border-color:#1F4E79}.tagbar .chip.clr{background:#fff;color:#c00;border-color:#f1c0c0}@page{size:A4 landscape;margin:10mm}@media print{header,.tabs,#tagbar{display:none!important}.wrap{padding:0!important;max-width:100%!important}#printhdr{display:block!important;margin:0 0 10px}.cli{break-inside:avoid;box-shadow:none;border:1px solid #ccc;margin-bottom:10px}table{font-size:9px}body{background:#fff}}#printhdr{display:none}@media (max-width:680px){
    header{padding:12px 14px}
    header .t h1{font-size:16px}
    .tabs{padding:10px 10px 0;overflow-x:auto;flex-wrap:nowrap;-webkit-overflow-scrolling:touch;scrollbar-width:none}
    .tabs::-webkit-scrollbar{display:none}
    .tabs button{padding:9px 16px;font-size:13px;white-space:nowrap;flex:0 0 auto}
    .wrap{padding:0 10px 40px}
    #tagbar{padding:0 10px}
    .cli{padding:12px 12px 14px}
    .cli h2{font-size:15px}
    .cli,#ocelotBody{overflow-x:auto;-webkit-overflow-scrolling:touch}
    table{table-layout:auto}
    th,td{padding:6px 8px;font-size:12px}
    th.m,td.m{width:auto;min-width:120px}
  }</style>
</head>
<body>

<div id="login">
  <div class="card">
    <h2 id="loginTitulo">Entrar</h2>
    <p id="loginSub">Acesso restrito · DRE Mercado Livre</p>
    <label>E-mail</label>
    <input id="email" type="email" autocomplete="username" placeholder="seu@email.com">
    <label>Senha</label>
    <input id="senha" type="password" autocomplete="current-password" placeholder="••••••••">
    <input id="senha2" type="password" autocomplete="new-password" placeholder="Repita a senha" style="display:none;margin-top:8px">
    <button class="btn" id="btnLogin" onclick="acaoLogin()">Entrar</button>
    <div class="err" id="loginErr"></div>
    <button class="link" id="toggleModo" onclick="toggleModo()">Primeiro acesso — criar senha master</button>
  </div>
</div>

<div id="appRoot" style="display:none">
<header>
  <div class="t">
    <h1>DRE · Acompanhamento Mercado Livre</h1>
    <p id="subtitulo"></p>
  </div>
  <div class="actions">
    
    <details class="dd" id="ddPeriodos"><summary>Períodos</summary><div class="menu" id="menuPeriodos"></div></details>
    <button class="reload" id="btnAtualizar" onclick="atualizar()">Atualizar</button>
    <button class="ghost" id="btnFecharMes" style="display:none" onclick="fecharMes()">Fechar mês</button>
    <button class="ghost" onclick="exportarPDF()">Exportar PDF</button>
    <button class="ghost" onclick="sair()">Sair</button>
  </div>
</header>
<div class="tabs">
  <button id="tabSemanal" class="on" onclick="trocaAba('semanal')">Semanal</button>
  <button id="tabMensal" onclick="trocaAba('mensal')">Mensal</button><button id="tabConcorrentes" onclick="trocaAba('concorrentes')">Concorrentes</button><button id="tabOcelot" onclick="trocaAba('ocelot')">Gestão Ocelot</button>
</div>
<div id="tagbar" class="tagbar"></div>
<div id="printhdr"></div>
<div class="wrap" id="app"><div class="empty">Carregando…</div></div>
</div>

<script>
const SB_URL="https://qrvdqqdigzabltqgxggm.supabase.co";
const SB_KEY="sb_publishable_DPvztgnqrFAX8NEyUjbEew_uuCL-s3U";
const API=SB_URL+"/functions/v1/ml-dados";
const COLETOR=SB_URL+"/functions/v1/ml-coletor";
const MERCADO=SB_URL+"/functions/v1/ml-mercado-dados";
const SETUP=SB_URL+"/functions/v1/setup-master";
const sb=window.supabase.createClient(SB_URL,SB_KEY);

/* ---------- LOGIN ---------- */
let modo="login";
function toggleModo(){
  modo = modo==="login"?"setup":"login";
  document.getElementById("senha2").style.display = modo==="setup"?"block":"none";
  document.getElementById("loginTitulo").textContent = modo==="setup"?"Criar senha master":"Entrar";
  document.getElementById("btnLogin").textContent = modo==="setup"?"Criar acesso":"Entrar";
  document.getElementById("toggleModo").textContent = modo==="setup"?"Já tenho acesso — entrar":"Primeiro acesso — criar senha master";
  document.getElementById("loginErr").textContent="";
}
async function acaoLogin(){
  const email=document.getElementById("email").value.trim().toLowerCase();
  const senha=document.getElementById("senha").value;
  const err=document.getElementById("loginErr"); err.textContent="";
  const btn=document.getElementById("btnLogin"); btn.disabled=true;
  try{
    if(modo==="setup"){
      const s2=document.getElementById("senha2").value;
      if(senha.length<8){err.textContent="A senha precisa ter ao menos 8 caracteres.";return;}
      if(senha!==s2){err.textContent="As senhas não conferem.";return;}
      const r=await fetch(SETUP,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({email,password:senha})});
      const j=await r.json();
      if(!r.ok){err.textContent=j.error||"Não foi possível criar o acesso.";return;}
    }
    const {error}=await sb.auth.signInWithPassword({email,password:senha});
    if(error){err.textContent="E-mail ou senha inválidos.";return;}
    mostrarApp();
  }catch(e){err.textContent="Erro: "+e;}
  finally{btn.disabled=false;}
}
async function sair(){ await sb.auth.signOut(); mostrarLogin(); }
function mostrarLogin(){ document.getElementById("appRoot").style.display="none"; document.getElementById("login").style.display="flex"; }
function mostrarApp(){ document.getElementById("login").style.display="none"; document.getElementById("appRoot").style.display="block"; load(); }

/* ---------- PAINEL ---------- */
const PADRAO=5;
const MESES=["jan","fev","mar","abr","mai","jun","jul","ago","set","out","nov","dez"];
const METRICAS_SEMANAL=[
  ["vendas","Vendas","money"],["unidades","Unidades","int"],["ticket","Ticket médio","money"],
  ["visitas","Visitas","int"],["qnt_vend","Qtd. vendas","int"],["conversao","Conversão","pct"],
  ["qnt_anuncios","Qtd. anúncios (todos os canais)","int"],
  ["anuncios_ativos","— ativos","int","sub"],["anuncios_inativos","— inativos","int","sub"],
  ["tacos","TACoS","pct"],["vendas_concluidas_60d","Vendas concluídas 60d","int"],["_rep_medalha","Reputação/Medalha","repmed"],["rep_reclamacoes_rate","Reclamações","pct"],["rep_cancel_rate","Cancelamentos","pct"],["rep_atraso_rate","Despachos com atraso","pct"],
];
const METRICAS_MENSAL=[
  ["vendas","Vendas","money"],["unidades","Unidades","int"],["ticket","Ticket médio","money"],
  ["visitas","Visitas","int"],["qnt_vend","Qtd. vendas","int"],["conversao","Conversão","pct"],
  ["vendas_com_pub","Vendas com publicidade","int"],["vendas_sem_pub","Vendas sem publicidade","int"],
];
const nf=new Intl.NumberFormat("pt-BR");
const cf=new Intl.NumberFormat("pt-BR",{minimumFractionDigits:2,maximumFractionDigits:2});
function fmt(v,t){ if(v==null||v==="") return "—"; if(t==="txt")return v==null?"—":String(v);const n=Number(v);
  if(t==="money") return "R$ "+cf.format(n);
  if(t==="pct") return cf.format(n*100)+"%";
  return nf.format(n); }
let DADOS=null, aba=(localStorage.getItem('ocelot_aba')||"semanal"), periodosSel=null;
function metricas(){ return aba==="mensal"?METRICAS_MENSAL:METRICAS_SEMANAL; }
function labelPeriodo(p){ const[y,m,d]=p.split("-"); return aba==="mensal"?(MESES[+m-1]+"/"+y.slice(2)):(d+"/"+m); }
function dataset(){ return {
  conta:DADOS.conta.filter(r=>r.granularidade===aba),
  cliente:DADOS.cliente.filter(r=>r.granularidade===aba),
  total:DADOS.total.filter(r=>r.granularidade===aba) }; }
function celula(cur,prev,tipo){
  if(cur==null||cur==="") return "—";
  let s=fmt(cur,tipo);
  if(prev!=null&&prev!==""&&Number(prev)!==0){
    const ch=(Number(cur)-Number(prev))/Math.abs(Number(prev));
    if(isFinite(ch)&&Math.abs(ch)>=0.0005){ const up=ch>0, pct=(Math.abs(ch)*100).toLocaleString("pt-BR",{maximumFractionDigits:1});
      s=`<span class="chg ${up?'up':'down'}">${up?'▲':'▼'}${pct}%</span> `+s; }
  }
  return s;
}
function medalPretty(m){const x={platinum:'Platinum',gold:'Gold',silver:'Prata',mercadolider:'MercadoLíder',mercado_lider:'MercadoLíder'};return x[String(m).toLowerCase()]||m;}
function nivelColor(n){const s=String(n||'').toLowerCase();if(s.includes('green'))return['Verde','#1aa64b'];if(s.includes('yellow'))return['Amarelo','#e6b800'];if(s.includes('orange'))return['Laranja','#e67e22'];if(s.includes('red'))return['Vermelho','#d93025'];return[n||'—','inherit'];}
function repMedCell(r){if(!r)return'—';if(r.medalha)return medalPretty(r.medalha);const c=nivelColor(r.reputacao_nivel);return`<span style="color:${c[1]};font-weight:600">${c[0]}</span>`;}
function toggleKids(td){const tr=td.parentElement;const open=tr.classList.toggle('open');const cr=td.querySelector('.caret');if(cr)cr.textContent=open?'▾':'▸';let n=tr.nextElementSibling;while(n&&n.classList.contains('subrow')){n.style.display=open?'table-row':'none';n=n.nextElementSibling;}}
function tabela(tag,cls,periodos,byPeriodo){
  let h=`<div class="tag ${cls}">${tag}</div><table><thead><tr><th class="m">Métrica</th>`;
  periodos.forEach(p=>{const api=byPeriodo[p]?.fonte==='api'?'<span class="api">API</span>':'';h+=`<th>${labelPeriodo(p)}${api}</th>`;});
  h+=`</tr></thead><tbody>`;
  const _MA=metricas();const _hideRep=(cls==='cliente'||cls==='total');for(let _j=0;_j<_MA.length;_j++){const[k,label,t,sub]=_MA[_j];if(_hideRep&&(k==='_rep_medalha'||k==='rep_reclamacoes_rate'||k==='rep_cancel_rate'||k==='rep_atraso_rate'))continue;const _kids=_MA[_j+1]&&_MA[_j+1][3]==='sub';
    h+=`<tr${sub?' class="subrow" style="display:none"':''}>`+(t==='repmed'?`<td class="m">${label}</td>`:sub?`<td class="m sub2">${label}</td>`:_kids?`<td class="m parent" style="cursor:pointer" onclick="toggleKids(this)"><span class="caret">▸</span> ${label}</td>`:`<td class="m">${label}</td>`);
    periodos.forEach((p,i)=>{ h+=`<td>${t==='repmed'?repMedCell(byPeriodo[p]):celula(byPeriodo[p]?.[k], i>0?byPeriodo[periodos[i-1]]?.[k]:null, t)}</td>`; });
    h+=`</tr>`;
  }
  return h+`</tbody></table>`;
}
function todosPeriodos(){ let _r=dataset().conta.filter(x=>contaVis(x.cliente_id,x.conta)); return [...new Set(_r.map(r=>r.periodo_fim))].sort(); }
function periodosAtivos(){ const all=todosPeriodos(); const _f=selKey(); if(window._psf!==_f){ periodosSel=null; window._psf=_f; } if(!periodosSel) periodosSel=all.slice(-PADRAO); const sel=periodosSel.filter(p=>all.includes(p)).sort(); return sel.length?sel:all.slice(-PADRAO); }
function render(){
  const app=document.getElementById("app");const D=dataset();
  const periodos=periodosAtivos();
  if(!periodos.length){app.innerHTML=`<div class="empty">Sem dados ${aba==='mensal'?'mensais':'semanais'} ainda.</div>`;return;}
  const clientes={};
  for(const r of D.conta){clientes[r.cliente_id]??={nome:r.cliente,contas:{}};clientes[r.cliente_id].contas[r.conta]??={};clientes[r.cliente_id].contas[r.conta][r.periodo_fim]=r;}
  const cliMap={};for(const r of D.cliente){cliMap[r.cliente_id]??={};cliMap[r.cliente_id][r.periodo_fim]=r;}
  const totMap={};for(const r of D.total)totMap[r.periodo_fim]=r;
  let html="";
  for(const cid in clientes){
    const cl=clientes[cid];const contasNomes=Object.keys(cl.contas).sort();
    const _vc=contasNomes.filter(c=>contaVis(cid,c)); if(!_vc.length)continue; html+=`<div class="cli"><h2>${cl.nome}</h2><div class="sub">${_vc.length} conta(s) · ${periodos.length} período(s) exibido(s)</div>`;
    for(const conta of _vc){ html+=tabela(conta,"conta",periodos,cl.contas[conta]); }
    if(_vc.length>1&&empFull(cid)) html+=tabela("TOTAL "+cl.nome,"cliente",periodos,cliMap[cid]||{});
    html+=`</div>`;
  }
  if(Object.keys(clientes).length>1&&SELT.size===0) html+=`<div class="cli">`+tabela("TOTAL GERAL","total",periodos,totMap)+`</div>`;
  const notaAba = aba==="mensal"
    ? `Visão <b>mensal</b> — cada coluna é um mês fechado (1º ao último dia). Ticket médio = vendas ÷ nº de vendas. "Vendas com/sem publicidade" separam pedidos atribuídos a anúncios pagos.`
    : `Qtd. anúncios = ativos + inativos em <b>todos os canais</b> (a "Gestão de Anúncios" do ML mostra menos por excluir os canais <i>proximity</i> e <i>MP merchants</i>). Razões (ticket, conversão, TACoS) recalculadas a partir dos totais.`;
  html+=`<div class="foot"><b>API</b> marca os períodos coletados automaticamente. Variação % compara com o período anterior (verde = aumento, vermelho = queda).<br>${notaAba}</div>`;
  app.innerHTML=html;
}
async function renderMercado(){
  const app=document.getElementById("app");
  app.innerHTML='<div class="empty">Carregando mercado…</div>';
  try{
    const {data:{session}}=await sb.auth.getSession();
    const r=await fetch(MERCADO,{cache:"no-store",headers:{Authorization:"Bearer "+(session?session.access_token:"")}});
    if(r.status===401){ mostrarLogin(); return; }
    const M=await r.json();
    if(!M.categorias||!M.categorias.length){ app.innerHTML='<div class="empty">Sem dados de mercado ainda.</div>'; return; }
    const fN=function(n){return n==null?"—":nf.format(n);};
    const fM=function(n){return n==null?"—":"R$ "+cf.format(n);};
    const dl=function(cur,ant){ if(ant==null||!ant) return ""; const d=(cur-ant)/ant*100; const up=d>=0; return ' <span style="color:'+(up?"#1e7e34":"#c00")+';font-size:11px">'+(up?"▲":"▼")+Math.abs(d).toFixed(0)+'%</span>'; };
    let h='<div class="foot" style="margin:6px 0 14px">Coleta de '+M.gerado+(M.data_ant?(' · comparado a '+M.data_ant):' · 1ª coleta — a variação (▲/▼) começa na próxima semana')+'. <b>Visitas 30d</b> = tráfego do anúncio (proxy de demanda). O ML não abre as unidades vendidas de terceiros.</div>';
    for(var ci=0;ci<M.categorias.length;ci++){
      const c=M.categorias[ci]; const rz=c.resumo;
      h+='<div class="cli"><h2>'+c.nome+'</h2>';
      h+='<div class="sub">'+rz.anuncios+' anúncios · '+rz.vendedores+' vendedores · faixa '+fM(rz.preco_min)+'–'+fM(rz.preco_max)+' · '+(rz.nossos?('vocês no top: '+rz.nossos):'<b style="color:#c00">vocês fora do top</b>')+'</div>';
      h+='<div style="font-size:12px;margin:2px 0 8px">Visitas totais do nicho (30d): <b>'+fN(rz.visitas_total)+'</b>'+dl(rz.visitas_total,rz.visitas_total_ant)+'</div>';
      let rows=""; const lim=Math.min(12,c.itens.length);
      for(var k=0;k<lim;k++){ const it=c.itens[k];
        const nome=it.nosso?('<b style="color:#1F4E79">'+it.rotulo+'</b>'):it.rotulo;
        rows+='<tr'+(k%2?' style="background:#F2F2F2"':'')+'><td style="padding:3px 6px">'+(k+1)+'</td><td style="padding:3px 6px">'+nome+'</td><td style="padding:3px 6px;text-align:right">'+fM(it.price)+'</td><td style="padding:3px 6px;text-align:right;white-space:nowrap">'+fN(it.visitas_30d)+dl(it.visitas_30d,it.visitas_ant)+'</td></tr>';
      }
      h+='<table style="width:100%;border-collapse:collapse;font-size:12px;border:1px solid #8C8C8C"><thead><tr style="background:#1F4E79;color:#fff"><th style="padding:4px 6px;text-align:left">#</th><th style="padding:4px 6px;text-align:left">Vendedor / anúncio</th><th style="padding:4px 6px;text-align:right">Preço</th><th style="padding:4px 6px;text-align:right">Visitas 30d</th></tr></thead><tbody>'+rows+'</tbody></table></div>';
    }
    app.innerHTML=h;
  }catch(e){ app.innerHTML='<div class="empty">Erro ao carregar mercado.</div>'; }
}

  return h;
}
function sortPedidos(arr){
  const dir=ocelotSortDir==='asc'?1:-1;
  const arr2=arr.slice();
  const campos={
    data:function(p){return new Date(p.data_venda_ts).getTime();},
    pedido:function(p){return Number(p.order_id)||0;},
    venda:function(p){return Number(p.valor_venda)||0;},
    taxa:function(p){return Number(p.taxa_ml)||0;},
    frete:function(p){return Number(p.frete_vendedor)||0;},
    devolvido:function(p){return Number(p.valor_devolvido)||0;},
    liquido:function(p){return Number(p.valor_liquido)||0;},
    cmv:function(p){return Number(p.cmv_total)||0;},
    imposto:function(p){return Number(p.imposto_valor)||0;},
    ads:function(p){return Number(p.ads_valor)||0;},
    custofixo:function(p){return Number(p.custofixo_valor)||0;},
    resultado:function(p){return Number(p.resultado)||0;},
    margem:function(p){return p.valor_liquido>0?(p.resultado/p.valor_liquido):-999;}
  };
  arr2.sort(function(a,b){
    if(ocelotSortBy==='mlb'){
      const av=(a.itens[0]&&a.itens[0].item_id)||'', bv=(b.itens[0]&&b.itens[0].item_id)||'';
      return dir*(av<bv?-1:av>bv?1:0);
    }
    const getter=campos[ocelotSortBy]||campos.data;
    const av=getter(a), bv=getter(b);
    return dir*(av-bv);
  });
  return arr2;
}

  return h;

function imprimirExtratoFornecedor(fornecedorId){
  const D=OCELOT_FORN_CACHE; if(!D)return;
  const f=D.fornecedores.find(function(x){return x.id===fornecedorId;}); if(!f)return;
  const P=function(v){return 'R$ '+cf.format(Number(v));};
  const mesLabel=function(m){const dt=new Date(m+'T00:00:00Z');return dt.toLocaleDateString('pt-BR',{month:'long',year:'numeric',timeZone:'UTC'});};
  let rows='';
  let totalGeral=0;
  for(const m of f.meses){
    rows+='<tr><td colspan="5" style="background:#f1f5f9;font-weight:700;padding:8px">'+mesLabel(m.mes_competencia)+' — '+P(m.total_atual)+(m.pago?' (pago em '+new Date(m.data_pagamento).toLocaleDateString('pt-BR')+')':' (em aberto)')+'</td></tr>';
    for(const it of m.itens){
      rows+='<tr><td>'+new Date(it.data_venda).toLocaleDateString('pt-BR')+'</td><td>'+it.order_id+'</td><td>'+(it.titulo||it.item_id)+'</td><td style="text-align:center">'+it.quantidade+'</td><td style="text-align:right">'+P(it.cmv)+'</td></tr>';
      totalGeral+=it.cmv;
    }
  }
  const html='<!doctype html><html lang="pt-br"><head><meta charset="utf-8"><title>Extrato — '+f.nome+'</title><style>'+
    'body{font-family:Arial,sans-serif;padding:24px;color:#111}h1{font-size:20px;margin-bottom:2px}p{color:#555;font-size:13px;margin-top:0}'+
    'table{width:100%;border-collapse:collapse;margin-top:16px;font-size:13px}th,td{border-bottom:1px solid #ddd;padding:6px 8px;text-align:left}th{background:#1F4E79;color:#fff}'+
    '.total{font-size:16px;font-weight:700;margin-top:16px;text-align:right}@media print{button{display:none}}'+
    '</style></head><body>'+
    '<h1>Extrato de pagamento — '+f.nome+'</h1>'+
    '<p>Gerado em '+new Date().toLocaleDateString('pt-BR')+' · DRE Ocelot</p>'+
    '<button onclick="window.print()" style="padding:8px 16px;border-radius:6px;border:none;background:#1F4E79;color:#fff;cursor:pointer;margin-bottom:10px">Imprimir / Salvar PDF</button>'+
    '<table><thead><tr><th>Data</th><th>Nº pedido</th><th>Produto</th><th>Qtd</th><th>Valor</th></tr></thead><tbody>'+rows+'</tbody></table>'+
    '<div class="total">Total geral: '+P(totalGeral)+'</div>'+
    '</body></html>';
  const w=window.open('','_blank');
  if(w){w.document.write(html);w.document.close();}
}

function selKey(){return [...SELT].sort().join('|');}
function empFull(cid){return SELT.size===0||SELT.has('cli:'+cid);}
function contaVis(cid,ap){return SELT.size===0||SELT.has('cli:'+cid)||SELT.has(ap);}
function toggleTag(t){if(SELT.has(t))SELT.delete(t);else SELT.add(t);montaFiltro();montaPeriodos();render();}
function limparTags(){SELT.clear();montaFiltro();montaPeriodos();render();}
function montaFiltro(){
  const bar=document.getElementById("tagbar");if(!bar)return;
  const clientes={};
  for(const r of DADOS.conta){(clientes[r.cliente_id]=clientes[r.cliente_id]||{nome:r.cliente,contas:new Set()}).contas.add(r.conta);}
  let h='<span class="taglbl">Empresas:</span>';
  for(const cid in clientes){h+='<button class="chip'+(SELT.has("cli:"+cid)?" on":"")+'" data-tok="cli:'+cid+'">'+clientes[cid].nome+'</button>';}
  h+='<span class="taglbl">Contas:</span>';
  for(const cid in clientes){[...clientes[cid].contas].sort().forEach(function(c){h+='<button class="chip c'+(SELT.has(c)?" on":"")+'" data-tok="'+c+'">'+c+'</button>';});}
  h+='<button class="chip clr" data-clr="1"'+(SELT.size?'':' style="display:none"')+'>× limpar filtro</button>';
  bar.innerHTML=h;
  bar.onclick=function(e){var el=e.target.closest("button");if(!el)return;if(el.dataset.clr){limparTags();}else if(el.dataset.tok){toggleTag(el.dataset.tok);}};
}

function exportarPDF(){
  const abaTxt=aba==='mensal'?'Mensal':'Semanal';
  let filtroTxt='Todas as empresas/contas';
  if(SELT.size){
    const cli={}; for(const r of DADOS.conta){cli[r.cliente_id]=r.cliente;}
    filtroTxt=[...SELT].map(function(t){return t.indexOf('cli:')===0?(cli[t.slice(4)]||t):t;}).join(', ');
  }
  const d=new Date();
  const dt=String(d.getDate()).padStart(2,'0')+'/'+String(d.getMonth()+1).padStart(2,'0')+'/'+d.getFullYear();
  document.getElementById('printhdr').innerHTML='<h1 style="margin:0;font-size:18px;color:#1F4E79">DRE · Acompanhamento Mercado Livre</h1><div style="font-size:12px;color:#555;margin-top:2px">Visão '+abaTxt+' · Filtro: '+filtroTxt+' · Gerado em '+dt+'</div>';
  const ot=document.title; document.title='DRE '+abaTxt+' '+dt.split('/').join('-');
  window.print();
  setTimeout(function(){document.title=ot;},800);
}
function montaPeriodos(){
  const all=todosPeriodos();const sel=periodosAtivos();const menu=document.getElementById("menuPeriodos");
  let h=`<label style="font-weight:600;border-bottom:1px solid var(--line)"><input type="checkbox" id="pTodos"> Mostrar todos</label>`;
  for(const p of [...all].reverse()) h+=`<label><input type="checkbox" class="pchk" value="${p}" ${sel.includes(p)?"checked":""}> ${labelPeriodo(p)}</label>`;
  menu.innerHTML=h;
  menu.querySelectorAll(".pchk").forEach(c=>c.onchange=()=>{periodosSel=[...menu.querySelectorAll(".pchk:checked")].map(x=>x.value);if(!periodosSel.length)periodosSel=all.slice(-PADRAO);render();});
  document.getElementById("pTodos").onchange=(e)=>{periodosSel=e.target.checked?all.slice():all.slice(-PADRAO);montaPeriodos();render();};
}
async function load(){
  document.getElementById("app").innerHTML=`<div class="empty">Carregando…</div>`;
  try{
    const {data:{session}}=await sb.auth.getSession();
    const r=await fetch(API,{cache:"no-store",headers:{Authorization:"Bearer "+(session?.access_token||"")}});
    if(r.status===401){ mostrarLogin(); return; }
    DADOS=await r.json();
    montaFiltro();trocaAba(aba);
    document.querySelector("#subtitulo").insertAdjacentHTML("beforeend",` <span class="pill">atualizado ${new Date().toLocaleString("pt-BR",{timeZone:"America/Sao_Paulo"})}</span>`);
  }catch(e){ document.getElementById("app").innerHTML=`<div class="empty">Erro ao carregar os dados.<br>${e}</div>`; }
}
async function atualizar(){
  const btn=document.getElementById("btnAtualizar");btn.disabled=true;const txt=btn.textContent;btn.textContent="Atualizando…";
  document.getElementById("app").innerHTML=`<div class="empty">Buscando dados novos direto do Mercado Livre…<br>Isso pode levar até ~30s por conta. Não feche a página.</div>`;
  try{const {data:{session:_s}}=await sb.auth.getSession();await fetch(COLETOR,{cache:"no-store",headers:{Authorization:"Bearer "+(_s?.access_token||"")}});}catch(e){}
  await load();
  btn.disabled=false;btn.textContent=txt;
}
async function fecharMes(){
  var btn=document.getElementById("btnFecharMes");
  var now=new Date(new Date().toLocaleString("en-US",{timeZone:"America/Sao_Paulo"}));
  var y=now.getFullYear(), m=now.getMonth(); if(m===0){y--;m=12;}
  var def=y+"-"+String(m).padStart(2,"0");
  var mes=prompt("Fechar qual mes? (formato AAAA-MM) Ex.: mes passado = "+def, def);
  if(!mes) return;
  if(!/^[0-9]{4}-[0-9]{2}$/.test(mes)){ alert("Formato invalido. Use AAAA-MM, ex.: 2026-06"); return; }
  var contas=[...new Map((DADOS.conta||[]).map(function(r){return [r.conta_id,r.conta];})).entries()];
  if(!contas.length){ alert("Nenhuma conta carregada."); return; }
  var ses=await sb.auth.getSession(); var tok=(ses.data.session&&ses.data.session.access_token)||"";
  btn.disabled=true; var t0=btn.textContent; btn.textContent="Fechando...";
  var app=document.getElementById("app");
  var done=0, okc=0; var fail=[];
  for(var i=0;i<contas.length;i++){
    var id=contas[i][0], nome=contas[i][1]; done++;
    app.innerHTML='<div class="empty">Fechando '+mes+' no Mercado Livre... '+done+'/'+contas.length+' - '+nome+'<br>Nao feche a pagina.</div>';
    try{
      var r=await fetch(SB_URL+"/functions/v1/ml-fechar-mes?mes="+mes+"&conta_id="+id,{method:"POST",cache:"no-store",headers:{Authorization:"Bearer "+tok}});
      var j=await r.json(); var row=j&&j.resultados&&j.resultados[0];
      if(row&&row.ok) okc++; else fail.push(nome);
    }catch(e){ fail.push(nome); }
  }
  await load(); aba="mensal"; trocaAba("mensal");
  btn.disabled=false; btn.textContent=t0;
  alert("Mes "+mes+" fechado: "+okc+" conta(s) OK"+(fail.length?("\nSem dados/erro: "+fail.join(", ")):""));
}
