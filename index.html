<!doctype html>
<html lang="pt-br">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>DRE · Acompanhamento Mercado Livre</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root{--bg:#0f172a;--panel:#ffffff;--line:#e5e8ee;--ink:#1f2733;--muted:#64748b;--accent:#2563eb;--head:#0f172a;--conta:#fff4d6;--cliente:#d9f0dd;--total:#cfe2fb;--up:#16a34a;--down:#dc2626}
  *{box-sizing:border-box}
  body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;margin:0;background:#f1f4f9;color:var(--ink)}
  header{background:var(--head);color:#fff;padding:16px 26px;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:10px}
  header .t h1{margin:0;font-size:19px;letter-spacing:.2px}
  header .t p{margin:4px 0 0;font-size:12.5px;color:#9fb0c9}
  header .actions{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
  select,button,.dd>summary{font:inherit;border-radius:8px;border:1px solid #2c3a52;background:#16213a;color:#fff;padding:8px 12px;cursor:pointer;list-style:none}
  button.reload{background:var(--accent);border-color:var(--accent)}
  button.ghost{background:transparent}
  button:disabled{opacity:.6;cursor:wait}
  .dd{position:relative}
  .dd>summary::-webkit-details-marker{display:none}
  .dd[open]>summary{background:var(--accent);border-color:var(--accent)}
  .dd .menu{position:absolute;right:0;top:42px;z-index:20;background:#fff;color:var(--ink);border:1px solid var(--line);border-radius:10px;box-shadow:0 8px 24px rgba(15,23,42,.18);padding:8px;min-width:170px;max-height:320px;overflow:auto}
  .dd .menu label{display:flex;gap:8px;align-items:center;padding:5px 8px;font-size:13px;border-radius:6px;cursor:pointer;white-space:nowrap}
  .dd .menu label:hover{background:#f1f5fb}
  .tabs{max-width:1280px;margin:0 auto;padding:16px 26px 0;display:flex;gap:8px}
  .tabs button{background:#fff;color:var(--muted);border:1px solid var(--line);border-bottom:none;border-radius:10px 10px 0 0;padding:10px 22px;font-weight:600}
  .tabs button.on{color:var(--ink);background:#fff;border-color:var(--line);box-shadow:0 -2px 0 var(--accent) inset}
  .wrap{max-width:1280px;margin:0 auto;padding:0 26px 60px}
  .cli{background:var(--panel);border:1px solid var(--line);border-radius:0 12px 12px 12px;padding:16px 20px 20px;margin-bottom:22px;box-shadow:0 1px 2px rgba(15,23,42,.04)}
  .cli h2{margin:2px 0 4px;font-size:17px}
  .cli .sub{color:var(--muted);font-size:12.5px;margin-bottom:6px}
  .tag{display:inline-block;font-size:12.5px;font-weight:700;padding:3px 12px;border-radius:6px;margin:16px 0 6px}
  .tag.conta{background:var(--conta)}.tag.cliente{background:var(--cliente)}.tag.total{background:var(--total)}
  table{border-collapse:collapse;width:100%;font-size:13px;margin-bottom:6px;table-layout:fixed}
  th.m,td.m{width:240px;white-space:normal;word-break:break-word}
  th,td{border:1px solid var(--line);padding:7px 12px;text-align:right;white-space:nowrap;vertical-align:top}
  th{background:#f5f7fb;font-weight:600;color:#334155}
  th.m,td.m{text-align:left;background:#fafbfd;font-weight:600}
  td.sub2,th.sub2{color:var(--muted);font-weight:500;padding-left:24px}
  tr:hover td{background:#f8fafc}
  tr:hover td.m{background:#f1f5fb}
  .chg{font-size:11px;margin-right:5px}
  .up{color:var(--up)} .down{color:var(--down)}
  .api{font-size:9px;background:var(--accent);color:#fff;padding:1px 5px;border-radius:3px;margin-left:4px;font-weight:700;letter-spacing:.3px}
  .empty{padding:40px;text-align:center;color:var(--muted)}
  .foot{color:var(--muted);font-size:12px;text-align:center;margin-top:18px;line-height:1.5}
  .pill{display:inline-block;background:#16213a;color:#9fb0c9;font-size:11px;padding:2px 8px;border-radius:20px;margin-left:8px}
  .cons-wrap{display:flex;gap:18px;align-items:flex-start}
  .cons-nav{width:190px;flex:0 0 190px;background:#fff;border:1px solid var(--line);border-radius:12px;padding:8px;position:sticky;top:14px}
  .cons-nav button{display:block;width:100%;text-align:left;background:transparent;color:var(--ink);border:none;border-radius:8px;padding:10px 12px;font-weight:600;font-size:13.5px;margin-bottom:2px;cursor:pointer}
  .cons-nav button:hover{background:#f1f5fb}
  .cons-nav button.on{background:#1F4E79;color:#fff}
  .cons-main{flex:1;min-width:0}
  .curva-cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin:14px 0}
  .curva-card{background:#fff;border:1px solid var(--line);border-radius:10px;padding:12px 14px}
  .curva-card .lbl{font-size:11px;color:var(--muted);font-weight:700;letter-spacing:.3px;text-transform:uppercase}
  .curva-card .val{font-size:20px;font-weight:700;margin-top:4px}
  .curva-card .sub{font-size:11.5px;color:var(--muted);margin-top:2px}
  .curva-classe-A{color:#16a34a}.curva-classe-B{color:#d97706}.curva-classe-C{color:#dc2626}
  .curva-tag{display:inline-block;font-size:11px;font-weight:700;color:#fff;padding:2px 8px;border-radius:5px}
  .curva-tag.A{background:#16a34a}.curva-tag.B{background:#d97706}.curva-tag.C{background:#dc2626}
  .curva-chip{font:inherit;font-size:12.5px;padding:6px 14px;border-radius:8px;border:1px solid var(--line);background:#fff;color:#333;cursor:pointer;font-weight:600}
  .curva-chip.on{background:#1F4E79;color:#fff;border-color:#1F4E79}
  .curva-bar-wrap{background:#f1f5f9;border-radius:5px;height:9px;overflow:hidden}
  .curva-bar{height:100%;background:linear-gradient(90deg,#2563eb,#60a5fa);border-radius:5px}
  .curva-expand{background:#f8fafc;border:1px solid var(--line);border-radius:10px;padding:14px 16px;margin:2px 0 10px}
  .curva-th{cursor:pointer;user-select:none}
  .curva-th.active{color:var(--accent)}
  /* login */
  #login{display:none;min-height:100vh;align-items:center;justify-content:center;background:var(--head)}
  .card{background:#fff;border-radius:14px;padding:32px;width:360px;max-width:92vw;box-shadow:0 20px 50px rgba(0,0,0,.35)}
  .card h2{margin:0 0 4px;font-size:20px}
  .card p{margin:0 0 18px;color:var(--muted);font-size:13px}
  .card label{display:block;font-size:12.5px;color:#475569;margin:12px 0 4px}
  .card input{width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:9px;font:inherit}
  .card .btn{width:100%;margin-top:18px;background:var(--accent);color:#fff;border:none;padding:12px;border-radius:9px;font-weight:600;cursor:pointer}
  .card .link{display:block;text-align:center;margin-top:14px;color:var(--accent);font-size:13px;cursor:pointer;background:none;border:none;width:100%}
  .card .err{color:var(--down);font-size:12.5px;margin-top:12px;min-height:16px}
.tagbar{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin:12px 0 2px;padding:8px 10px;background:#fff;border:1px solid var(--line,#e5e7eb);border-radius:10px}.taglbl{font-size:12px;font-weight:600;color:#666;margin:0 2px 0 6px}.tagbar .chip{font:inherit;font-size:12px;line-height:1.4;padding:3px 10px;border:1px solid var(--line,#d0d5dd);border-radius:999px;background:#f3f4f6;color:#333;cursor:pointer}.tagbar .chip.c{background:#eef2ff}.tagbar .chip.on{background:#1F4E79;color:#fff;border-color:#1F4E79}.tagbar .chip.clr{background:#fff;color:#c00;border-color:#f1c0c0}@page{size:A4 landscape;margin:10mm}@media print{header,.tabs,#tagbar{display:none!important}.wrap{padding:0!important;max-width:100%!important}#printhdr{display:block!important;margin:0 0 10px}.cli{break-inside:avoid;box-shadow:none;border:1px solid #ccc;margin-bottom:10px}table{font-size:9px}body{background:#fff}}#printhdr{display:none}@media (max-width:680px){
    header{padding:12px 14px}
    header .t h1{font-size:16px}
    .tabs{padding:10px 10px 0;overflow-x:auto;flex-wrap:nowrap;-webkit-overflow-scrolling:touch;scrollbar-width:none}
    .tabs::-webkit-scrollbar{display:none}
    .tabs button{padding:9px 16px;font-size:13px;white-space:nowrap;flex:0 0 auto}
    .wrap{padding:0 10px 40px}
    #tagbar{padding:0 10px}
    .cli{padding:12px 12px 14px}
    .cli h2{font-size:15px}
    .cli,#ocelotBody{overflow-x:auto;-webkit-overflow-scrolling:touch}
    table{table-layout:auto}
    th,td{padding:6px 8px;font-size:12px}
    th.m,td.m{width:auto;min-width:120px}
  }</style>
</head>
<body>

<div id="login">
  <div class="card">
    <h2 id="loginTitulo">Entrar</h2>
    <p id="loginSub">Acesso restrito · DRE Mercado Livre</p>
    <label>E-mail</label>
    <input id="email" type="email" autocomplete="username" placeholder="seu@email.com">
    <label>Senha</label>
    <input id="senha" type="password" autocomplete="current-password" placeholder="••••••••">
    <input id="senha2" type="password" autocomplete="new-password" placeholder="Repita a senha" style="display:none;margin-top:8px">
    <button class="btn" id="btnLogin" onclick="acaoLogin()">Entrar</button>
    <div class="err" id="loginErr"></div>
    <button class="link" id="toggleModo" onclick="toggleModo()">Primeiro acesso — criar senha master</button>
  </div>
</div>

<div id="appRoot" style="display:none">
<header>
  <div class="t">
    <h1>DRE · Acompanhamento Mercado Livre</h1>
    <p id="subtitulo"></p>
  </div>
  <div class="actions">
    
    <details class="dd" id="ddPeriodos"><summary>Períodos</summary><div class="menu" id="menuPeriodos"></div></details>
    <button class="reload" id="btnAtualizar" onclick="atualizar()">Atualizar</button>
    <button class="ghost" id="btnFecharMes" style="display:none" onclick="fecharMes()">Fechar mês</button>
    <button class="ghost" onclick="exportarPDF()">Exportar PDF</button>
    <button class="ghost" onclick="sair()">Sair</button>
  </div>
</header>
<div class="tabs">
  <button id="tabSemanal" class="on" onclick="trocaAba('semanal')">Semanal</button>
  <button id="tabMensal" onclick="trocaAba('mensal')">Mensal</button><button id="tabConcorrentes" onclick="trocaAba('concorrentes')">Concorrentes</button><button id="tabOcelot" onclick="trocaAba('ocelot')">Gestão Ocelot</button><button id="tabConsultoria" onclick="trocaAba('consultoria')">Consultoria</button>
</div>
<div id="tagbar" class="tagbar"></div>
<div id="printhdr"></div>
<div class="wrap" id="app"><div class="empty">Carregando…</div></div>
</div>

<script>
const SB_URL="https://qrvdqqdigzabltqgxggm.supabase.co";
const SB_KEY="sb_publishable_DPvztgnqrFAX8NEyUjbEew_uuCL-s3U";
const API=SB_URL+"/functions/v1/ml-dados";
const COLETOR=SB_URL+"/functions/v1/ml-coletor";
const MERCADO=SB_URL+"/functions/v1/ml-mercado-dados";
const SETUP=SB_URL+"/functions/v1/setup-master";
const sb=window.supabase.createClient(SB_URL,SB_KEY);

/* ---------- LOGIN ---------- */
let modo="login";
function toggleModo(){
  modo = modo==="login"?"setup":"login";
  document.getElementById("senha2").style.display = modo==="setup"?"block":"none";
  document.getElementById("loginTitulo").textContent = modo==="setup"?"Criar senha master":"Entrar";
  document.getElementById("btnLogin").textContent = modo==="setup"?"Criar acesso":"Entrar";
  document.getElementById("toggleModo").textContent = modo==="setup"?"Já tenho acesso — entrar":"Primeiro acesso — criar senha master";
  document.getElementById("loginErr").textContent="";
}
async function acaoLogin(){
  const email=document.getElementById("email").value.trim().toLowerCase();
  const senha=document.getElementById("senha").value;
  const err=document.getElementById("loginErr"); err.textContent="";
  const btn=document.getElementById("btnLogin"); btn.disabled=true;
  try{
    if(modo==="setup"){
      const s2=document.getElementById("senha2").value;
      if(senha.length<8){err.textContent="A senha precisa ter ao menos 8 caracteres.";return;}
      if(senha!==s2){err.textContent="As senhas não conferem.";return;}
      const r=await fetch(SETUP,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({email,password:senha})});
      const j=await r.json();
      if(!r.ok){err.textContent=j.error||"Não foi possível criar o acesso.";return;}
    }
    const {error}=await sb.auth.signInWithPassword({email,password:senha});
    if(error){err.textContent="E-mail ou senha inválidos.";return;}
    mostrarApp();
  }catch(e){err.textContent="Erro: "+e;}
  finally{btn.disabled=false;}
}
async function sair(){ await sb.auth.signOut(); mostrarLogin(); }
function mostrarLogin(){ document.getElementById("appRoot").style.display="none"; document.getElementById("login").style.display="flex"; }
function mostrarApp(){ document.getElementById("login").style.display="none"; document.getElementById("appRoot").style.display="block"; load(); }

/* ---------- PAINEL ---------- */
const PADRAO=5;
const MESES=["jan","fev","mar","abr","mai","jun","jul","ago","set","out","nov","dez"];
const METRICAS_SEMANAL=[
  ["vendas","Vendas","money"],["unidades","Unidades","int"],["ticket","Ticket médio","money"],
  ["visitas","Visitas","int"],["qnt_vend","Qtd. vendas","int"],["conversao","Conversão","pct"],
  ["qnt_anuncios","Qtd. anúncios (todos os canais)","int"],
  ["anuncios_ativos","— ativos","int","sub"],["anuncios_inativos","— inativos","int","sub"],
  ["tacos","TACoS","pct"],["vendas_concluidas_60d","Vendas concluídas 60d","int"],["_rep_medalha","Reputação/Medalha","repmed"],["rep_reclamacoes_rate","Reclamações","pct"],["rep_cancel_rate","Cancelamentos","pct"],["rep_atraso_rate","Despachos com atraso","pct"],
];
const METRICAS_MENSAL=[
  ["vendas","Vendas","money"],["unidades","Unidades","int"],["ticket","Ticket médio","money"],
  ["visitas","Visitas","int"],["qnt_vend","Qtd. vendas","int"],["conversao","Conversão","pct"],
  ["vendas_com_pub","Vendas com publicidade","int"],["vendas_sem_pub","Vendas sem publicidade","int"],
];
const nf=new Intl.NumberFormat("pt-BR");
const cf=new Intl.NumberFormat("pt-BR",{minimumFractionDigits:2,maximumFractionDigits:2});
function fmt(v,t){ if(v==null||v==="") return "—"; if(t==="txt")return v==null?"—":String(v);const n=Number(v);
  if(t==="money") return "R$ "+cf.format(n);
  if(t==="pct") return cf.format(n*100)+"%";
  return nf.format(n); }
let DADOS=null, aba=(localStorage.getItem('ocelot_aba')||"semanal"), periodosSel=null;
function metricas(){ return aba==="mensal"?METRICAS_MENSAL:METRICAS_SEMANAL; }
function labelPeriodo(p){ const[y,m,d]=p.split("-"); return aba==="mensal"?(MESES[+m-1]+"/"+y.slice(2)):(d+"/"+m); }
function dataset(){ return {
  conta:DADOS.conta.filter(r=>r.granularidade===aba),
  cliente:DADOS.cliente.filter(r=>r.granularidade===aba),
  total:DADOS.total.filter(r=>r.granularidade===aba) }; }
function celula(cur,prev,tipo){
  if(cur==null||cur==="") return "—";
  let s=fmt(cur,tipo);
  if(prev!=null&&prev!==""&&Number(prev)!==0){
    const ch=(Number(cur)-Number(prev))/Math.abs(Number(prev));
    if(isFinite(ch)&&Math.abs(ch)>=0.0005){ const up=ch>0, pct=(Math.abs(ch)*100).toLocaleString("pt-BR",{maximumFractionDigits:1});
      s=`<span class="chg ${up?'up':'down'}">${up?'▲':'▼'}${pct}%</span> `+s; }
  }
  return s;
}
function medalPretty(m){const x={platinum:'Platinum',gold:'Gold',silver:'Prata',mercadolider:'MercadoLíder',mercado_lider:'MercadoLíder'};return x[String(m).toLowerCase()]||m;}
function nivelColor(n){const s=String(n||'').toLowerCase();if(s.includes('green'))return['Verde','#1aa64b'];if(s.includes('yellow'))return['Amarelo','#e6b800'];if(s.includes('orange'))return['Laranja','#e67e22'];if(s.includes('red'))return['Vermelho','#d93025'];return[n||'—','inherit'];}
function repMedCell(r){if(!r)return'—';if(r.medalha)return medalPretty(r.medalha);const c=nivelColor(r.reputacao_nivel);return`<span style="color:${c[1]};font-weight:600">${c[0]}</span>`;}
function toggleKids(td){const tr=td.parentElement;const open=tr.classList.toggle('open');const cr=td.querySelector('.caret');if(cr)cr.textContent=open?'▾':'▸';let n=tr.nextElementSibling;while(n&&n.classList.contains('subrow')){n.style.display=open?'table-row':'none';n=n.nextElementSibling;}}
function tabela(tag,cls,periodos,byPeriodo){
  let h=`<div class="tag ${cls}">${tag}</div><table><thead><tr><th class="m">Métrica</th>`;
  periodos.forEach(p=>{const api=byPeriodo[p]?.fonte==='api'?'<span class="api">API</span>':'';h+=`<th>${labelPeriodo(p)}${api}</th>`;});
  h+=`</tr></thead><tbody>`;
  const _MA=metricas();const _hideRep=(cls==='cliente'||cls==='total');for(let _j=0;_j<_MA.length;_j++){const[k,label,t,sub]=_MA[_j];if(_hideRep&&(k==='_rep_medalha'||k==='rep_reclamacoes_rate'||k==='rep_cancel_rate'||k==='rep_atraso_rate'))continue;const _kids=_MA[_j+1]&&_MA[_j+1][3]==='sub';
    h+=`<tr${sub?' class="subrow" style="display:none"':''}>`+(t==='repmed'?`<td class="m">${label}</td>`:sub?`<td class="m sub2">${label}</td>`:_kids?`<td class="m parent" style="cursor:pointer" onclick="toggleKids(this)"><span class="caret">▸</span> ${label}</td>`:`<td class="m">${label}</td>`);
    periodos.forEach((p,i)=>{ h+=`<td>${t==='repmed'?repMedCell(byPeriodo[p]):celula(byPeriodo[p]?.[k], i>0?byPeriodo[periodos[i-1]]?.[k]:null, t)}</td>`; });
    h+=`</tr>`;
  }
  return h+`</tbody></table>`;
}
function todosPeriodos(){ let _r=dataset().conta.filter(x=>contaVis(x.cliente_id,x.conta)); return [...new Set(_r.map(r=>r.periodo_fim))].sort(); }
function periodosAtivos(){ const all=todosPeriodos(); const _f=selKey(); if(window._psf!==_f){ periodosSel=null; window._psf=_f; } if(!periodosSel) periodosSel=all.slice(-PADRAO); const sel=periodosSel.filter(p=>all.includes(p)).sort(); return sel.length?sel:all.slice(-PADRAO); }
function render(){
  const app=document.getElementById("app");const D=dataset();
  const periodos=periodosAtivos();
  if(!periodos.length){app.innerHTML=`<div class="empty">Sem dados ${aba==='mensal'?'mensais':'semanais'} ainda.</div>`;return;}
  const clientes={};
  for(const r of D.conta){clientes[r.cliente_id]??={nome:r.cliente,contas:{}};clientes[r.cliente_id].contas[r.conta]??={};clientes[r.cliente_id].contas[r.conta][r.periodo_fim]=r;}
  const cliMap={};for(const r of D.cliente){cliMap[r.cliente_id]??={};cliMap[r.cliente_id][r.periodo_fim]=r;}
  const totMap={};for(const r of D.total)totMap[r.periodo_fim]=r;
  let html="";
  for(const cid in clientes){
    const cl=clientes[cid];const contasNomes=Object.keys(cl.contas).sort();
    const _vc=contasNomes.filter(c=>contaVis(cid,c)); if(!_vc.length)continue; html+=`<div class="cli"><h2>${cl.nome}</h2><div class="sub">${_vc.length} conta(s) · ${periodos.length} período(s) exibido(s)</div>`;
    for(const conta of _vc){ html+=tabela(conta,"conta",periodos,cl.contas[conta]); }
    if(_vc.length>1&&empFull(cid)) html+=tabela("TOTAL "+cl.nome,"cliente",periodos,cliMap[cid]||{});
    html+=`</div>`;
  }
  if(Object.keys(clientes).length>1&&SELT.size===0) html+=`<div class="cli">`+tabela("TOTAL GERAL","total",periodos,totMap)+`</div>`;
  const notaAba = aba==="mensal"
    ? `Visão <b>mensal</b> — cada coluna é um mês fechado (1º ao último dia). Ticket médio = vendas ÷ nº de vendas. "Vendas com/sem publicidade" separam pedidos atribuídos a anúncios pagos.`
    : `Qtd. anúncios = ativos + inativos em <b>todos os canais</b> (a "Gestão de Anúncios" do ML mostra menos por excluir os canais <i>proximity</i> e <i>MP merchants</i>). Razões (ticket, conversão, TACoS) recalculadas a partir dos totais.`;
  html+=`<div class="foot"><b>API</b> marca os períodos coletados automaticamente. Variação % compara com o período anterior (verde = aumento, vermelho = queda).<br>${notaAba}</div>`;
  app.innerHTML=html;
}
async function renderMercado(){
  const app=document.getElementById("app");
  app.innerHTML='<div class="empty">Carregando mercado…</div>';
  try{
    const {data:{session}}=await sb.auth.getSession();
    const r=await fetch(MERCADO,{cache:"no-store",headers:{Authorization:"Bearer "+(session?session.access_token:"")}});
    if(r.status===401){ mostrarLogin(); return; }
    const M=await r.json();
    if(!M.categorias||!M.categorias.length){ app.innerHTML='<div class="empty">Sem dados de mercado ainda.</div>'; return; }
    const fN=function(n){return n==null?"—":nf.format(n);};
    const fM=function(n){return n==null?"—":"R$ "+cf.format(n);};
    const dl=function(cur,ant){ if(ant==null||!ant) return ""; const d=(cur-ant)/ant*100; const up=d>=0; return ' <span style="color:'+(up?"#1e7e34":"#c00")+';font-size:11px">'+(up?"▲":"▼")+Math.abs(d).toFixed(0)+'%</span>'; };

    if(p.entregue)h+='<button onclick="ocultarEntrega(\''+encodeURIComponent(JSON.stringify(p.order_ids))+'\',true)" style="padding:6px 12px;border-radius:8px;border:1px solid var(--line);background:#fff;cursor:pointer;font-size:12px">Ocultar</button>';
    h+='</div>';
    if(multi){
      h+='<div class="'+cls+'" style="display:none;margin-top:10px;padding-top:10px;border-top:1px solid var(--line)">';
      for(let ii=0;ii<p.itens.length;ii++){
        const it=p.itens[ii];
        h+='<div style="display:flex;gap:10px;align-items:center;margin-bottom:8px">';
        if(it.thumbnail)h+='<img src="'+it.thumbnail+'" style="width:40px;height:40px;object-fit:cover;border-radius:6px;border:1px solid var(--line)" onerror="this.style.display=\'none\'">';
        h+='<div>'+(it.permalink?('<a href="'+it.permalink+'" target="_blank" rel="noopener">'+(it.titulo||it.item_id)+'</a>'):(it.titulo||it.item_id))+' <span style="color:var(--muted)">× '+it.quantidade+'</span>'+(it.estoque!=null?(' <span style="font-size:11px;color:var(--muted)">— estoque: '+it.estoque+'</span>'):'')+'</div>';
        h+='</div>';
      }
      h+='</div>';
    }
    if(e.receiver_address_line||e.receiver_comment){
      h+='<div style="font-size:12px;color:var(--muted);margin-top:8px;padding-top:8px;border-top:1px solid var(--line)">'+(e.receiver_address_line||'')+(e.receiver_neighborhood?(', '+e.receiver_neighborhood):'')+(e.receiver_comment?('<br><i>Obs.: '+e.receiver_comment+'</i>'):'')+'</div>';
    }
    const perguntas=e.perguntas||[];
    const mensagens=e.mensagens||[];
    if(perguntas.length||mensagens.length){
      h+='<div style="font-size:12px;margin-top:8px;padding-top:8px;border-top:1px solid var(--line)">';
      for(let qi=0;qi<perguntas.length;qi++){
        const q=perguntas[qi];
        h+='<div style="margin-bottom:4px"><b>Pergunta antes da compra:</b> "'+(q.pergunta||'')+'"'+(q.resposta?(' — resp.: "'+q.resposta+'"'):'')+'</div>';
      }
      for(let mi=0;mi<mensagens.length;mi++){
        const m=mensagens[mi];
        h+='<div style="margin-bottom:4px"><b>'+(m.de==='comprador'?'Comprador':'Vendedor')+':</b> '+(m.texto||'')+'</div>';
      }
      h+='</div>';
    }
    h+='</div>';
  }
  return h;
}

async function renderOcelot(){
  const app=document.getElementById('app');
  app.innerHTML='<div class="empty">Carregando gestão Ocelot…</div>';
  try{
    const {data:{session}}=await sb.auth.getSession();
    const qs=(ocelotMesFiltro?('?mes='+ocelotMesFiltro):('?dias=30'));
    const r=await fetch(SB_URL+'/functions/v1/ml-ocelot-dados'+qs,{cache:'no-store',headers:{Authorization:'Bearer '+(session?session.access_token:'')}});
    if(r.status===401){mostrarLogin();return;}
    OCELOT_CACHE=await r.json();
  }catch(e){app.innerHTML='<div class="empty">Erro ao carregar gestão Ocelot.<br>'+e+'</div>';return;}
  renderOcelotBody();
}
async function renderFornecedores(){
  try{
    const {data:{session}}=await sb.auth.getSession();
    const r=await fetch(SB_URL+'/functions/v1/ml-ocelot-fornecedores',{cache:'no-store',headers:{Authorization:'Bearer '+(session?session.access_token:'')}});
    if(r.status===401){mostrarLogin();return;}
    OCELOT_FORN_CACHE=await r.json();
  }catch(e){}
  renderOcelotBody();
}
function ocelotSubTab(s){
  ocelotSub=s;localStorage.setItem('ocelot_sub',s);
  if(s==='fornecedores'){renderFornecedores();return;}
  if(s==='entregas'){renderEntregas();return;}
  renderOcelotBody();
}
function ocelotSubBtn(k,label){
  const on=ocelotSub===k;
  return '<button onclick="ocelotSubTab(\''+k+'\')" style="padding:8px 16px;border-radius:8px;border:1px solid var(--line);background:'+(on?'#1F4E79':'#fff')+';color:'+(on?'#fff':'#333')+';font-weight:600;cursor:pointer;margin-right:8px">'+label+'</button>';
}
function renderOcelotBody(){
  if(ocelotSub==='fornecedores'&&!OCELOT_FORN_CACHE){renderFornecedores();return;}
  if(ocelotSub==='entregas'&&!OCELOT_ENTREGAS_CACHE){renderEntregas();return;}
  const app=document.getElementById('app');
  app.style.maxWidth=ocelotSub==='vendas'?'none':'';
  let h='<div style="margin:4px 0 16px">'+ocelotSubBtn('vendas','DRE por venda')+ocelotSubBtn('detalhada','DRE detalhada')+ocelotSubBtn('config','Custos & parâmetros')+'</div><div id="ocelotBody"></div>';
  app.innerHTML=h;
  const body=document.getElementById('ocelotBody');
  if(ocelotSub==='vendas')body.innerHTML=htmlOcelotVendas();
  else if(ocelotSub==='detalhada')body.innerHTML=htmlOcelotDetalhada();
  else if(ocelotSub==='fornecedores')body.innerHTML=htmlOcelotFornecedores();
  else if(ocelotSub==='entregas')body.innerHTML=htmlOcelotEntregas();
  else body.innerHTML=htmlOcelotConfig();
}
let ocelotFiltroCats={cancelada:false,devolucao:false,cmvZero:false};
let ocelotMesFiltro=null;
let ocelotSortBy='data';
let ocelotSortDir='desc';
let ocelotBusca='';
let ocelotPagina=1;
let ocelotSoCarrinho=false;
let OCELOT_FORN_CACHE=null;
let ocelotFornExpandido=null;
let ocelotFornEditMapa=false;
function ocelotToggleFiltroCat(chk,cat){ocelotFiltroCats[cat]=chk.checked;ocelotPagina=1;renderOcelotBody();}
function ocelotToggleCarrinho(chk){ocelotSoCarrinho=chk.checked;ocelotPagina=1;renderOcelotBody();}
function ocelotMesChange(sel){ocelotMesFiltro=sel.value||null;ocelotPagina=1;renderOcelot();}
function ocelotSortChange(campo){
  if(ocelotSortBy===campo){ocelotSortDir=ocelotSortDir==='asc'?'desc':'asc';}
  else{ocelotSortBy=campo;ocelotSortDir='desc';}
  ocelotPagina=1;
  renderOcelotBody();
}
function ocelotBuscaChange(inp){
  ocelotBusca=inp.value;
  ocelotPagina=1;
  renderOcelotBody();
  const el=document.getElementById('ocelotBuscaInput');
  if(el){el.focus();const v=el.value;el.value='';el.value=v;}
}
function ocelotPaginaIr(delta,total){
  ocelotPagina=Math.min(Math.max(1,ocelotPagina+delta),total);
  renderOcelotBody();
}
function ocelotPaginaJump(inp,total){
  let n=parseInt(inp.value,10);
  if(isNaN(n))n=1;
  ocelotPagina=Math.min(Math.max(1,n),total);
  renderOcelotBody();
}
async function editarCmvOcelot(input,itemId,mes,qtdOrig){
  const val=input.value;
  if(val===''||isNaN(Number(val)))return;
  input.disabled=true;
  try{
    const {data:{session}}=await sb.auth.getSession();
    await fetch(SB_URL+'/functions/v1/ml-ocelot-set',{method:'POST',headers:{'Content-Type':'application/json',Authorization:'Bearer '+(session?session.access_token:'')},body:JSON.stringify({tipo:'custo',item_id:itemId,mes_competencia:mes,custo_unitario:Number(val),observacao:'editado na DRE por venda'})});
  }catch(e){}
  await renderOcelot();
}
function ocelotChecklistHTML(){
  var D=OCELOT_CACHE; if(!D||!D.pedidos)return '';
  var itensAtivos=[];
  (D.pedidos||[]).forEach(function(p){ if(p.status!=='cancelled')(p.itens||[]).forEach(function(it){itensAtivos.push(it);}); });
  var totalReceita=itensAtivos.reduce(function(s,it){return s+Number(it.valor_venda||0);},0);
  var naoManual=itensAtivos.filter(function(it){return it.cmv_origem&&it.cmv_origem!=='manual';});
  var receitaNaoManual=naoManual.reduce(function(s,it){return s+Number(it.valor_venda||0);},0);
  var mesesNoPeriodo=Array.from(new Set(itensAtivos.map(function(it){return it.mes_competencia;}).filter(Boolean)));
  var mesesAbertos=mesesNoPeriodo.filter(function(m){
    var p=(D.parametros||[]).find(function(pp){return pp.mes_competencia===m;});
    return !p||p.fechado!==true;
  });
  var tacosAprox=mesesNoPeriodo.filter(function(m){
    var f=(D.tacos_fonte_por_mes||{})[m]||'';
    return f.indexOf('aproximado')===0;
  });
  var canceladosN=D.cancelados_count||0;
  var pctNaoManual=totalReceita>0?(receitaNaoManual/totalReceita*100):0;
  var itens=[];
  if(naoManual.length>0){
    itens.push('<b>'+naoManual.length+'</b> item(ns) ('+pctNaoManual.toLocaleString('pt-BR',{maximumFractionDigits:1})+'% da receita do período) com CMV estimado por fórmula (residual/piso/teto), não por custo cadastrado — ver selo em cada linha na aba "DRE por venda".');
  }
  if(mesesAbertos.length>0){
    itens.push('Mês(es) <b>'+mesesAbertos.join(', ')+'</b> ainda em aberto — custo fixo rateado e resultado são provisórios, mudam com novas vendas.');
  }
  if(tacosAprox.length>0){
    itens.push('Ads do(s) mês(es) <b>'+tacosAprox.join(', ')+'</b> usa TACoS aproximado (último snapshot coletado), não o TACoS real fechado daquele mês.');
  }
  if(canceladosN>0){
    itens.push('<b>'+canceladosN+'</b> pedido(s) cancelado(s) no período — já excluídos do resultado, aparecem só na linha de Cancelamentos.');
  }
  if(itens.length===0)return '<div style="background:rgba(62,210,122,0.10);border:1px solid rgba(62,210,122,0.35);border-radius:8px;padding:12px 14px;margin-bottom:14px;color:#1b7a43;font-size:12.5px;max-width:900px"><b>Checklist de qualidade:</b> sem pendências — CMV cadastrado, mês fechado, TACoS real.</div>';
  return '<div style="background:rgba(232,184,75,0.10);border:1px solid rgba(232,184,75,0.35);border-radius:8px;padding:12px 14px;margin-bottom:14px;color:#92720c;font-size:12.5px;line-height:1.6;max-width:900px"><b>Checklist de qualidade — ver antes dos números:</b><br>'+itens.join('<br>')+'</div>';
}
function htmlOcelotVendas(){
  const D=OCELOT_CACHE; if(!D||!D.pedidos)return '<div class="empty">Sem dados.</div>';
  const P=function(v){return v==null?'—':'R$ '+cf.format(Number(v));};
  const dtf=function(v){return new Date(v).toLocaleDateString('pt-BR');};
  let filtrados=D.pedidos;
  const ocelotCatsAtivas=Object.keys(ocelotFiltroCats).filter(function(k){return ocelotFiltroCats[k];});
  if(ocelotCatsAtivas.length===0){
    filtrados=filtrados.filter(function(p){return p.status!=='cancelled';});
  }else{
    filtrados=filtrados.filter(function(p){
      if(ocelotFiltroCats.cancelada&&p.status==='cancelled')return true;
      if(ocelotFiltroCats.devolucao&&p.status!=='cancelled'&&Number(p.valor_devolvido||0)!==0)return true;
      if(ocelotFiltroCats.cmvZero&&p.status!=='cancelled'&&Number(p.cmv_total||0)===0)return true;
      return false;
    });
  }
  if(ocelotSoCarrinho)filtrados=filtrados.filter(function(p){return p.is_carrinho;});
  if(ocelotBusca)filtrados=filtrados.filter(function(p){return (p.order_ids||[p.order_id]).some(function(oid){return String(oid).indexOf(ocelotBusca)!==-1;})||String(p.pack_id||'').indexOf(ocelotBusca)!==-1;});
  const todos=sortPedidos(filtrados);
  const PAGESIZE=50;
  const totalPaginas=Math.max(1,Math.ceil(todos.length/PAGESIZE));
  if(ocelotPagina>totalPaginas)ocelotPagina=totalPaginas;
  if(ocelotPagina<1)ocelotPagina=1;
  const lista=todos.slice((ocelotPagina-1)*PAGESIZE,ocelotPagina*PAGESIZE);
  const mesesOpts=(D.meses_disponiveis||[]).map(function(m){
    const dt=new Date(m+'T00:00:00Z');
    const label=dt.toLocaleDateString('pt-BR',{month:'long',year:'numeric',timeZone:'UTC'});
    return '<option value="'+m+'"'+(ocelotMesFiltro===m?' selected':'')+'>'+label+'</option>';
  }).join('');
  let h=ocelotChecklistHTML()+'<div class="foot" style="margin:0 0 12px;text-align:left;display:flex;gap:14px;flex-wrap:wrap;align-items:center">';
  h+='<span>'+(D.mes_filtro?'Mês selecionado':('Últimos '+D.dias+' dias'))+' · '+D.resumo.n_vendas+' pedidos · '+D.resumo.n_itens+' itens vendidos.'+'</span>';
  if(D.por_forma_pagamento){
    const fpMap={credit_card:'Cartão crédito',debit_card:'Cartão débito',account_money:'Saldo ML',bank_transfer:'Pix/Transf.',ticket:'Boleto',digital_currency:'Moeda digital',prepaid_card:'Pré-pago','não identificado':'Não identificado'};
    const totalFp=Object.values(D.por_forma_pagamento).reduce(function(s,v){return s+v.n_vendas;},0);
    const partes=Object.keys(D.por_forma_pagamento).sort(function(a,b){return D.por_forma_pagamento[b].n_vendas-D.por_forma_pagamento[a].n_vendas;})
      .map(function(k){const v=D.por_forma_pagamento[k];const pct=totalFp?(v.n_vendas/totalFp*100):0;return (fpMap[k]||k)+' '+pct.toFixed(0)+'%';}).join(' · ');
    if(partes)h+='<span style="color:#94a3b8">Pagamento: '+partes+'</span>';
  }
  h+='<button onclick="atualizarOcelot()" id="btnAtualizarOcelot" style="background:var(--accent);color:#fff;border:none;padding:4px 10px;border-radius:6px;cursor:pointer">Atualizar vendas</button>';
  h+='<label style="display:flex;align-items:center;gap:5px">Buscar nº pedido <input id="ocelotBuscaInput" type="text" value="'+(ocelotBusca||'')+'" oninput="ocelotBuscaChange(this)" placeholder="ex: 2000017..." style="padding:3px 8px;border-radius:6px;border:1px solid var(--line);width:160px"></label>';
  h+='<span>'+todos.length+' pedido(s)'+(ocelotBusca?' encontrados':' no período')+'</span>';
  h+='<label>Período <select onchange="ocelotMesChange(this)" style="padding:3px 6px;border-radius:6px;border:1px solid var(--line)"><option value=""'+(!ocelotMesFiltro?' selected':'')+'>Últimos 30 dias</option>'+mesesOpts+'</select></label>';
  h+='<label style="display:flex;align-items:center;gap:5px"><input type="checkbox" onchange="ocelotToggleFiltroCat(this,\'cancelada\')"'+(ocelotFiltroCats.cancelada?' checked':'')+'> Canceladas</label>';
  h+='<label style="display:flex;align-items:center;gap:5px"><input type="checkbox" onchange="ocelotToggleFiltroCat(this,\'devolucao\')"'+(ocelotFiltroCats.devolucao?' checked':'')+'> Devoluções</label>';
  h+='<label style="display:flex;align-items:center;gap:5px"><input type="checkbox" onchange="ocelotToggleFiltroCat(this,\'cmvZero\')"'+(ocelotFiltroCats.cmvZero?' checked':'')+'> CMV zerado</label>';
  if(ocelotCatsAtivas.length===0&&D.cancelados_count)h+='<span style="color:#94a3b8">('+D.cancelados_count+' pedido(s) cancelado(s) ocultos — marque "Canceladas" p/ ver)</span>';
  h+='<label style="display:flex;align-items:center;gap:5px"><input type="checkbox" onchange="ocelotToggleCarrinho(this)"'+(ocelotSoCarrinho?' checked':'')+'> Mostrar só carrinhos 🛒</label>';
  h+='</div>';
  h+='<div class="foot" style="margin:0 0 10px;text-align:left;display:flex;gap:8px;align-items:center">';
  h+='<span style="color:#94a3b8">Ordenar por:</span>';
  function sortBtn(campo,label){
    const ativo=ocelotSortBy===campo;
    const seta=ativo?(ocelotSortDir==='asc'?' ▲':' ▼'):'';
    return '<button onclick="ocelotSortChange(\''+campo+'\')" style="padding:3px 10px;border-radius:6px;border:1px solid var(--line);background:'+(ativo?'#1F4E79':'#fff')+';color:'+(ativo?'#fff':'#333')+';cursor:pointer;font-size:12.5px">'+label+seta+'</button>';
  }
  h+=sortBtn('data','Data')+sortBtn('margem','Margem')+sortBtn('mlb','MLB');
  h+='</div>';
  if(!lista.length){h+='<div class="empty">Nenhuma venda no período.</div>';return h;}
  function thSort(campo,label,cls){
    const ativo=ocelotSortBy===campo;
    const seta=ativo?(ocelotSortDir==='asc'?' ▲':' ▼'):'';
    return '<th'+(cls?' class="'+cls+'"':'')+' onclick="ocelotSortChange(\''+campo+'\')" style="cursor:pointer;user-select:none'+(ativo?';color:var(--accent)':'')+'">'+label+seta+'</th>';
  }
  h+='<table><thead><tr>'+thSort('data','Data / Produto','m')+thSort('pedido','Nº pedido')+'<th>Pagamento</th>'+thSort('venda','Venda')+thSort('taxa','Taxa ML')+thSort('frete','Frete')+thSort('devolvido','Devolvido')+thSort('liquido','Líquido')+thSort('cmv','CMV')+thSort('imposto','Imposto')+thSort('ads','Ads')+thSort('custofixo','Custo fixo')+thSort('resultado','Resultado')+thSort('margem','Margem')+'</tr></thead><tbody>';
  function formaPagLabel(fp,parc){
    const map={credit_card:'Cartão crédito',debit_card:'Cartão débito',account_money:'Saldo ML',bank_transfer:'Pix/Transf.',ticket:'Boleto',digital_currency:'Moeda digital',prepaid_card:'Pré-pago'};
    const lbl=map[fp]||fp||'—';
    return lbl+((parc&&parc>1)?(' '+parc+'x'):'');
  }
  function statusPill(origem,status){
    if(status==='cancelled')return ' <span class="pill" style="background:#dc2626">cancelado</span>';
    if(status==='partially_refunded')return ' <span class="pill" style="background:#f59e0b">devolução parcial</span>';
    if(origem==='manual')return ' <span class="pill" style="background:#1F4E79">custo cadastrado</span>';
    if(origem==='formula_devolvido')return ' <span class="pill" style="background:#dc2626">CMV zerado (devolução)</span>';
    if(origem==='formula_piso')return ' <span class="pill" style="background:#0891b2">preço mínimo assumido</span>';
    if(origem==='formula_teto')return ' <span class="pill" style="background:#7c3aed">preço máximo assumido</span>';
    return ' <span class="pill" style="background:#94a3b8">estimado</span>';
  }
  function cmvCell(it){
    if(it.status==='cancelled')return '—';
    const total=P(it.cmv_total);
    return '<div style="display:flex;flex-direction:column;gap:2px"><span>R$ <input type="number" step="0.01" value="'+Number(it.cmv_unitario).toFixed(2)+'" onclick="event.stopPropagation()" onchange="editarCmvOcelot(this,\''+it.item_id+'\',\''+it.mes_competencia+'\','+it.quantidade+')" style="width:64px;padding:2px 4px;border:1px solid var(--line);border-radius:5px"></span><span style="font-size:10.5px;color:#94a3b8">un.'+(it.quantidade>1?(' × '+it.quantidade+' = '+total):'')+'</span></div>';
  }
  for(let pi=0;pi<lista.length;pi++){
    const p=lista[pi];
    const multi=p.itens.length>1;
    const margem=p.valor_liquido>0?(p.resultado/p.valor_liquido*100):null;
    const cls='ped_'+p.order_id;
    const titulo=p.is_carrinho?('🛒 Carrinho — '+p.itens.length+' itens ('+p.order_ids.length+' pedidos)'):(multi?('Pedido — '+p.itens.length+' itens'):(p.itens[0].titulo||p.itens[0].item_id));
    const origem=multi?'':statusPill(p.itens[0].cmv_origem,p.status);
    const cmvColuna=multi?P(p.cmv_total)+'<div style="font-size:10.5px;color:#94a3b8">expanda p/ editar por item</div>':cmvCell(p.itens[0]);
    h+='<tr'+(multi?' style="cursor:pointer" onclick="toggleOcelotPed(\''+cls+'\')"':'')+'><td class="m">'+(multi?'▸ ':'')+dtf(p.data_venda_ts)+' — '+titulo+origem+'</td><td>'+(p.is_carrinho?('🛒 '+p.pack_id+'<div style="font-size:10px;color:#94a3b8;font-weight:400">'+p.order_ids.length+' pedidos</div>'):p.order_id)+'</td><td>'+formaPagLabel(p.forma_pagamento,p.parcelas)+'</td><td>'+P(p.valor_venda)+'</td><td>'+P(p.taxa_ml)+'</td><td>'+P(p.frete_vendedor)+'</td><td>'+(p.valor_devolvido?P(p.valor_devolvido):'—')+'</td><td>'+P(p.valor_liquido)+'</td><td>'+cmvColuna+'</td><td>'+(p.tem_breakdown?P(p.imposto_valor):'—')+'</td><td>'+(p.tem_breakdown?P(p.ads_valor):'—')+'</td><td>'+(p.tem_breakdown?P(p.custofixo_valor):'—')+'</td><td style="'+(p.resultado<0?'color:#dc2626':'color:#16a34a')+'">'+P(p.resultado)+'</td><td>'+(margem==null?'—':margem.toFixed(1).replace('.',',')+'%')+'</td></tr>';
    if(multi){
      for(let ii=0;ii<p.itens.length;ii++){
        const it=p.itens[ii];

  h+='<span>Página <input type="number" min="1" max="'+totalPaginas+'" value="'+ocelotPagina+'" onchange="ocelotPaginaJump(this,'+totalPaginas+')" style="width:55px;padding:2px 4px;border-radius:6px;border:1px solid var(--line);text-align:center"> de '+totalPaginas+' ('+todos.length+' pedido(s), 50 por página)</span>';

  h+='</div>';
  h+='<div class="foot" style="text-align:left;margin-top:10px">CMV = valor líquido recebido menos a retenção de imposto+gestão+ads(TACoS real via API)+custo fixo, retenção calculada sobre o valor BRUTO da venda. "Resultado" é só a fatia de gestão (seu lucro) — Imposto/Ads/Custo fixo aparecem em colunas próprias porque também saem do CMV pago ao fornecedor (Miguel/Alan), não do seu lucro. "estimado" = sem custo cadastrado nesse SKU. Edite o CMV direto na tabela pra cadastrar o custo real. Frete é estimativa (heurística via API de envios) — ainda não validada 1:1 contra seu extrato do ML.</div>';

}
function sortPedidos(arr){
  const dir=ocelotSortDir==='asc'?1:-1;
  const arr2=arr.slice();
  const campos={
    data:function(p){return new Date(p.data_venda_ts).getTime();},
    pedido:function(p){return Number(p.order_id)||0;},
    venda:function(p){return Number(p.valor_venda)||0;},
    taxa:function(p){return Number(p.taxa_ml)||0;},
    frete:function(p){return Number(p.frete_vendedor)||0;},
    devolvido:function(p){return Number(p.valor_devolvido)||0;},
    liquido:function(p){return Number(p.valor_liquido)||0;},
    cmv:function(p){return Number(p.cmv_total)||0;},
    imposto:function(p){return Number(p.imposto_valor)||0;},
    ads:function(p){return Number(p.ads_valor)||0;},
    custofixo:function(p){return Number(p.custofixo_valor)||0;},
    resultado:function(p){return Number(p.resultado)||0;},
    margem:function(p){return p.valor_liquido>0?(p.resultado/p.valor_liquido):-999;}
  };
  arr2.sort(function(a,b){
    if(ocelotSortBy==='mlb'){
      const av=(a.itens[0]&&a.itens[0].item_id)||'', bv=(b.itens[0]&&b.itens[0].item_id)||'';
      return dir*(av<bv?-1:av>bv?1:0);
    }
    const getter=campos[ocelotSortBy]||campos.data;
    const av=getter(a), bv=getter(b);
    return dir*(av-bv);
  });
  return arr2;
}

function htmlOcelotDetalhada(){
  const D=OCELOT_CACHE; if(!D)return '<div class="empty">Sem dados.</div>';
  const ped=(D.pedidos||[]).filter(function(p){return p.status!=='cancelled';});
  const brl=function(v){var n=Number(v)||0;return (n<0?'-':'')+'R$ '+cf.format(Math.abs(n));};
  const pct=function(v,base){return base?((Number(v)/base*100).toLocaleString('pt-BR',{minimumFractionDigits:1,maximumFractionDigits:1})+'%'):'—';};
  function soma(campo){var s=0;for(var i=0;i<ped.length;i++)s+=Number(ped[i][campo]||0);return s;}
  const vendaAtiva=soma('valor_venda');
  const cancelamentos=Number((D.waterfall&&D.waterfall.cancelamentos)||0);
  const devolucoes=soma('valor_devolvido');
  const faturamentoBruto=vendaAtiva+cancelamentos;
  const faturamentoLiquido=faturamentoBruto-cancelamentos-devolucoes;
  const impostos=soma('imposto_valor');
  const receitaLiquida=faturamentoLiquido-impostos;
  const taxaML=soma('taxa_ml');
  const frete=soma('frete_vendedor');
  const margemInterna=receitaLiquida-taxaML-frete;
  const cmv=soma('cmv_total');
  const lucroBruto=margemInterna-cmv;
  const ads=soma('ads_valor');
  const custoAdm=soma('custofixo_valor');
  const resultado=lucroBruto-ads-custoAdm;
  const mesesOpts=(D.meses_disponiveis||[]).map(function(m){
    const dt=new Date(m+'T00:00:00Z');
    const label=dt.toLocaleDateString('pt-BR',{month:'long',year:'numeric',timeZone:'UTC'});
    return '<option value="'+m+'"'+(ocelotMesFiltro===m?' selected':'')+'>'+label+'</option>';
  }).join('');
  const paramMes=(D.parametros||[]).find(function(p){return p.mes_competencia===ocelotMesFiltro;});
  const mesAberto=!ocelotMesFiltro||!paramMes||paramMes.fechado!==true;
  function linha(rotulo,valor,pctTxt,tipo){
    const estilo={
      total:'background:rgba(255,255,255,0.04);font-weight:700;border-top:none;font-size:15px',
      subtotal:'background:rgba(46,117,182,0.20);font-weight:700',
      resultado:'background:rgba(62,210,122,0.18);font-weight:800;font-size:16px',
      resultadoNeg:'background:rgba(255,107,107,0.18);font-weight:800;font-size:16px'
    };
    const v=Number(valor)||0;
    const corValor=v<0?'#ff8a8a':(tipo?'#fff':'rgba(255,255,255,0.85)');
    return '<div style="display:grid;grid-template-columns:1fr 80px 160px;align-items:center;padding:9px 18px;font-size:14px;border-top:1px solid rgba(255,255,255,0.08);'+(estilo[tipo]||'')+'">'+
      '<span style="color:rgba(255,255,255,0.8)">'+rotulo+'</span>'+
      '<span style="text-align:right;font-size:12px;color:rgba(255,255,255,0.45)">'+(pctTxt||'')+'</span>'+
      '<span style="text-align:right;font-variant-numeric:tabular-nums;color:'+corValor+'">'+brl(valor)+'</span>'+
      '</div>';
  }
  let h='<div class="cli">';
  h+='<h2>DRE detalhada</h2>'+ocelotChecklistHTML();
  h+='<div style="margin:4px 0 16px;display:flex;gap:14px;flex-wrap:wrap;align-items:center">';
  h+='<label>Período <select onchange="ocelotMesChange(this)" style="padding:3px 6px;border-radius:6px;border:1px solid var(--line)"><option value=""'+(!ocelotMesFiltro?' selected':'')+'>Últimos 30 dias</option>'+mesesOpts+'</select></label>';
  h+='<span style="color:#94a3b8">'+ped.length+' pedido(s) no período</span>';
  h+='</div>';
  if(mesAberto)h+='<div style="background:rgba(232,184,75,0.10);border:1px solid rgba(232,184,75,0.35);border-radius:8px;padding:14px;margin-bottom:16px;color:#92720c;font-size:13px;line-height:1.5;max-width:900px"><b>Período em aberto.</b> Este mês ainda não foi fechado — os números abaixo são parciais e vão mudar conforme novas vendas entram e o custo fixo é recalculado.</div>';
  h+='<div style="background:#0f172a;border:1px solid rgba(255,255,255,0.08);border-radius:12px;overflow:hidden;max-width:900px">';
  h+=linha('FATURAMENTO BRUTO',faturamentoBruto,'100,0%','total');
  h+=linha('(-) Cancelamentos',-cancelamentos,pct(-cancelamentos,faturamentoBruto));
  h+=linha('(-) Devoluções',-devolucoes,pct(-devolucoes,faturamentoBruto));
  h+=linha('FATURAMENTO LÍQUIDO',faturamentoLiquido,'100,0%','subtotal');
  h+=linha('(-) Impostos',-impostos,pct(-impostos,faturamentoLiquido));
  h+=linha('RECEITA LÍQUIDA',receitaLiquida,pct(receitaLiquida,faturamentoLiquido),'subtotal');
  h+=linha('(-) Taxa Mercado Livre',-taxaML,pct(-taxaML,faturamentoLiquido));
  h+=linha('(-) Frete pago pelo vendedor',-frete,pct(-frete,faturamentoLiquido));
  h+=linha('MARGEM DE CONTRIBUIÇÃO INTERNA DO ML',margemInterna,pct(margemInterna,faturamentoLiquido),'subtotal');
  h+=linha('(-) CMV (custo dos produtos)',-cmv,pct(-cmv,faturamentoLiquido));
  h+=linha('LUCRO BRUTO',lucroBruto,pct(lucroBruto,faturamentoLiquido),'subtotal');
  h+=linha('(-) Ads (Mercado Ads / TACoS real)',-ads,pct(-ads,faturamentoLiquido));
  h+=linha('(-) Custo administrativo',-custoAdm,pct(-custoAdm,faturamentoLiquido));
  h+=linha('RESULTADO LÍQUIDO',resultado,pct(resultado,faturamentoLiquido),resultado<0?'resultadoNeg':'resultado');
  h+='</div>';
  h+='<div class="foot" style="text-align:left;margin-top:10px;max-width:900px">Cada linha é somada direto dos pedidos do período (mesma base da aba "DRE por venda"), sem dupla contagem: Taxa ML e Frete são descontados antes do CMV porque o CMV do Ocelot já é um residual (o que sobra pra pagar o fornecedor depois de tudo), não um custo de produto independente — por isso a ordem aqui difere um pouco do formato original que inspirou esse layout. "Custo administrativo" é o custo fixo mensal (aluguel, sistema etc.) rateado sobre a venda. Cancelamentos somam os pedidos cancelados no período; as demais linhas somam só os pedidos ativos.</div>';
  h+='</div>';
  return h;
}

async function registrarReclamacao(fornecedorId){
  const orderId=prompt('Número do pedido (order_id) relacionado, se for de uma venda específica (deixe em branco se não for):');
  const itemId=prompt('Código do item (item_id), se souber (opcional):');
  const valorStr=prompt('Valor do custo de reclamação (R$):');
  if(!valorStr)return;
  const valor=Number(String(valorStr).replace(',','.'));
  if(!valor||isNaN(valor)||valor<=0)return alert('Valor inválido.');
  const deFornecedor=confirm('Esse custo é culpa do FORNECEDOR?\n\nOK = sim, descontar do próximo pagamento dele\nCancelar = não, o custo é seu (só reduz seu resultado, não mexe no pagamento do fornecedor)');
  const observacao=prompt('Observação (opcional):')||'';
  const mes=new Date().toISOString().slice(0,7)+'-01';
  try{
    const {data:{session}}=await sb.auth.getSession();
    const r=await fetch(SB_URL+'/functions/v1/ml-ocelot-fornecedor-set',{method:'POST',headers:{'Content-Type':'application/json',Authorization:'Bearer '+(session?session.access_token:'')},body:JSON.stringify({tipo:'registrar_reclamacao',fornecedor_id:fornecedorId,order_id:orderId?Number(orderId):null,item_id:itemId||null,mes_competencia:mes,valor,de_quem:deFornecedor?'fornecedor':'tiago',observacao})});
    const j=await r.json().catch(function(){return {};});
    if(j.error)return alert('Erro: '+j.error);
  }catch(e){return alert('Erro ao registrar.');}
  await renderFornecedores();
}

function imprimirExtratoFornecedor(fornecedorId){

  const P=function(v){return 'R$ '+cf.format(Number(v));};

  // Monta uma lista única (vendas + descontos) em vez de tabelas separadas por mês -- assim dá pra
  // filtrar por nº de pedido e ordenar clicando no cabeçalho em cima do extrato inteiro, não só dentro
  // de cada mês. O resumo por mês (total/status) continua exibido à parte, no topo.
  const linhas=[];
  let totalGeral=0;
  const resumoMeses=[];
  for(const m of f.meses){
    resumoMeses.push({mes:m.mes_competencia,label:mesLabel(m.mes_competencia),total:m.total_atual,pago:m.pago,dataPagamento:m.data_pagamento});
    for(const it of m.itens){
      linhas.push({tipo:'venda',mes:m.mes_competencia,mesLabel:mesLabel(m.mes_competencia),data:it.data_venda,pedido:it.order_id,produto:it.titulo||it.item_id,qtd:it.quantidade,valor:it.cmv});
      totalGeral+=it.cmv;

        linhas.push({tipo:'desconto',mes:m.mes_competencia,mesLabel:mesLabel(m.mes_competencia),data:d.data_venda||null,pedido:d.order_id||null,produto:(d.titulo||d.item_id||'')+' ('+label+')',qtd:null,valor:-Math.abs(Number(d.valor))});
      }
    }
  }
  const linhasJson=JSON.stringify(linhas).replace(/<\/script/gi,'<\\/script');
  const resumoRows=resumoMeses.map(function(m){
    return '<tr><td>'+m.label+'</td><td style="text-align:right">'+P(m.total)+'</td><td>'+(m.pago?('pago em '+new Date(m.dataPagamento).toLocaleDateString('pt-BR')):'em aberto')+'</td></tr>';
  }).join('');
  const mesOpts=resumoMeses.map(function(m){
    return '<option value="'+m.mes+'">'+m.label+' — '+(m.pago?'pago':'aberto')+'</option>';
  }).join('');
  const html=`<!doctype html><html lang="pt-br"><head><meta charset="utf-8"><title>Extrato — ${f.nome}</title><style>
    body{font-family:Arial,sans-serif;padding:24px;color:#111}h1{font-size:20px;margin-bottom:2px}h3{font-size:14px;margin:20px 0 6px}p{color:#555;font-size:13px;margin-top:0}
    table{width:100%;border-collapse:collapse;margin-top:8px;font-size:13px}th,td{border-bottom:1px solid #ddd;padding:6px 8px;text-align:left}
    th{background:#1F4E79;color:#fff}
    #extratoTable th{cursor:pointer;user-select:none;white-space:nowrap}#extratoTable th:hover{background:#163a5c}
    #extratoTable th .seta{font-size:10px;opacity:.8}
    tr.desconto{color:#dc2626;background:#fff7f0}
    .total{font-size:16px;font-weight:700;margin-top:14px;text-align:right}
    #buscaPedido{padding:7px 10px;border:1px solid #ccc;border-radius:6px;font-size:13px;width:240px;margin:10px 0}
    #filtroMes{padding:7px 10px;border:1px solid #ccc;border-radius:6px;font-size:13px;margin:10px 0 10px 10px}
    @media print{button,#buscaPedido,#filtroMes,.noprint{display:none}}
    </style></head><body>
    <h1>Extrato de pagamento — ${f.nome}</h1>
    <p>Gerado em ${new Date().toLocaleDateString('pt-BR')} · DRE Ocelot</p>
    <button onclick="window.print()" class="noprint" style="padding:8px 16px;border-radius:6px;border:none;background:#1F4E79;color:#fff;cursor:pointer;margin-bottom:10px">Imprimir / Salvar PDF</button>
    <h3>Resumo por mês</h3>
    <table><thead><tr><th>Mês</th><th style="text-align:right">Total CMV</th><th>Status</th></tr></thead><tbody>${resumoRows}</tbody></table>
    <h3>Vendas e descontos <span style="font-weight:400;color:#666;font-size:12px">(clique no cabeçalho da coluna pra ordenar)</span></h3>
    <input id="buscaPedido" type="text" placeholder="Buscar nº pedido..." oninput="filtrarExtrato()"><select id="filtroMes" onchange="filtrarExtrato()"><option value="">Todos os meses</option>${mesOpts}</select>
    <table id="extratoTable"><thead><tr>
      <th data-campo="mesLabel">Mês</th><th data-campo="data">Data</th><th data-campo="pedido">Nº pedido</th><th data-campo="produto">Produto</th><th data-campo="qtd" style="text-align:center">Qtd</th><th data-campo="valor" style="text-align:right">Valor</th>
    </tr></thead><tbody id="extratoBody"></tbody></table>
    <div class="total" id="totalDiv">Total geral (vendas): ${P(totalGeral)}</div>
    <script>
      var LINHAS=${linhasJson};
      var TOTAL_GERAL=${totalGeral};
      var sortCampo=null, sortDir=1, busca='', mesSel='';
      function fmtBR(v){return v==null?'—':'R$ '+Number(v).toLocaleString('pt-BR',{minimumFractionDigits:2,maximumFractionDigits:2});}
      function fmtData(v){return v?new Date(v).toLocaleDateString('pt-BR'):'—';}
      function renderExtrato(){
        var linhas=LINHAS.slice();
        var filtroAtivo=!!(mesSel||busca);
        if(mesSel)linhas=linhas.filter(function(l){return l.mes===mesSel;});
        if(busca)linhas=linhas.filter(function(l){return l.pedido!=null&&String(l.pedido).indexOf(busca)!==-1;});
        if(sortCampo){
          linhas.sort(function(a,b){
            var av=a[sortCampo],bv=b[sortCampo];
            if(av==null&&bv==null)return 0; if(av==null)return 1; if(bv==null)return -1;
            if(typeof av==='number'&&typeof bv==='number')return (av-bv)*sortDir;
            return String(av).localeCompare(String(bv),'pt-BR')*sortDir;
          });
        }
        var out='';
        var totalFiltrado=0;
        for(var i=0;i<linhas.length;i++){
          var l=linhas[i];
          if(l.tipo==='venda')totalFiltrado+=l.valor;
          out+='<tr'+(l.tipo==='desconto'?' class="desconto"':'')+'><td>'+l.mesLabel+'</td><td>'+fmtData(l.data)+'</td><td>'+(l.pedido||'—')+'</td><td>'+l.produto+'</td><td style="text-align:center">'+(l.qtd==null?'—':l.qtd)+'</td><td style="text-align:right">'+fmtBR(l.valor)+'</td></tr>';
        }
        document.getElementById('extratoBody').innerHTML=out||'<tr><td colspan="6" style="text-align:center;color:#888">Nenhum resultado.</td></tr>';
        document.getElementById('totalDiv').textContent=(filtroAtivo?'Total filtrado (vendas): ':'Total geral (vendas): ')+fmtBR(totalFiltrado);
        var ths=document.querySelectorAll('#extratoTable th');
        for(var j=0;j<ths.length;j++){
          var campo=ths[j].getAttribute('data-campo');
          var base=ths[j].textContent.replace(/\\s*[▲▼]$/,'');
          ths[j].textContent=base+(sortCampo===campo?(sortDir===1?' ▲':' ▼'):'');
        }
      }
      function filtrarExtrato(){busca=document.getElementById('buscaPedido').value.trim();mesSel=document.getElementById('filtroMes').value;renderExtrato();}
      Array.prototype.forEach.call(document.querySelectorAll('#extratoTable th'),function(th){
        th.addEventListener('click',function(){
          var campo=th.getAttribute('data-campo');
          if(sortCampo===campo){sortDir=-sortDir;}else{sortCampo=campo;sortDir=1;}
          renderExtrato();
        });
      });
      renderExtrato();
    <\/script>
    </body></html>`;
  const w=window.open('','_blank');
  if(w){w.document.write(html);w.document.close();}
}

function curvaGetter(col,pctCampo,pctAcumCampo){
  if(col===pctCampo)return function(it){return it[pctCampo]||0;};
  if(col===pctAcumCampo)return function(it){return it[pctAcumCampo]||0;};
  if(col==='var')return function(it){return it.var_unidades_pct==null?-1e9:it.var_unidades_pct;};
  if(col==='lucro')return function(it){return it.lucro==null?-1e9:it.lucro;};
  if(col==='margem')return function(it){return it.margem==null?-1e9:it.margem;};
  return function(it){return Number(it[col])||0;};
}

function htmlCurvaExpandido(it){

  if(it.var_unidades_pct==null)varTxt='novo';

  let h='<div style="display:flex;gap:24px;flex-wrap:wrap;align-items:center">';

  h+='<div class="curva-bar-wrap" style="height:12px;background:#e5e8ee"><div class="curva-bar" style="width:'+(it.unidades_ant/max*100)+'%;background:#94a3b8"></div></div>';

async function curvaAbrirComparativo(itemId,contaId){
  curvaCompItem=itemId;curvaCompConta=contaId;curvaCompMes=null;CURVA_COMP_CACHE=null;
  curvaView='comparativo';
  renderConsultoriaBody();
  await curvaCarregarComparativo();
}
async function curvaCarregarComparativo(){
  const main=document.getElementById('consMain');
  if(main)main.innerHTML='<div class="empty">Carregando comparativo…</div>';
  try{
    const {data:{session}}=await sb.auth.getSession();
    let qs='?item='+encodeURIComponent(curvaCompItem)+'&conta='+encodeURIComponent(curvaCompConta);
    if(curvaCompMes)qs+='&mes='+curvaCompMes;
    const r=await fetch(SB_URL+'/functions/v1/ml-curva-abc'+qs,{cache:'no-store',headers:{Authorization:'Bearer '+(session?session.access_token:'')}});
    if(r.status===401){mostrarLogin();return;}
    CURVA_COMP_CACHE=await r.json();
  }catch(e){if(main)main.innerHTML='<div class="empty">Erro ao carregar comparativo.<br>'+e+'</div>';return;}
  renderConsultoriaBody();
}

  }
  h+='</div>';

    h+='<td>'+it.cliente_nome+' / '+it.conta_apelido+'</td><td>'+(it.status||'—')+'</td>';
    h+='<td>'+(it.health!=null?(it.health*100).toFixed(0)+'%':'—')+'</td><td style="color:'+CORES[it.faixa]+';font-weight:700">'+LABELS[it.faixa]+'</td>';
    h+='<td>'+nf.format(it.estoque||0)+'</td><td>'+nf.format(it.vendidos||0)+'</td><td>'+fmtDataBR(it.date_created)+'</td></tr>';
  }
  h+='</tbody></table></div>';
  h+='</div>';
  return h;
}

  }catch(e){if(main)main.innerHTML='<div class="empty">Erro ao carregar tendências.<br>'+e+'</div>';return;}

}
function htmlTendencias(){
  let h='<div class="cli">';
  h+='<h2>Tendências</h2>';
  h+='<div class="sub">Buscas em alta no Mercado Livre inteiro (site-wide — não é específico das suas contas) — sinal pra pensar em novos produtos, títulos de anúncio ou reforço de estoque. Atualizado 1x/dia.</div>';
  if(!TEND_CACHE){h+='<div class="empty">Carregando…</div></div>';return h;}
  const D=TEND_CACHE;
  if(D.sem_dado||!D.itens||!D.itens.length){h+='<div class="empty">Ainda sem coleta de tendências.</div></div>';return h;}
  h+='<div style="font-size:12.5px;color:#64748b;margin:10px 0">Top '+D.itens.length+' · '+fmtDataBR(D.data_atual)+(D.data_comparacao?(' · comparado com '+fmtDataBR(D.data_comparacao)):' · ainda sem histórico suficiente pra comparação')+'</div>';
  h+='<table><thead><tr><th style="width:34px">#</th><th class="m">Busca</th><th>Variação</th></tr></thead><tbody>';
  for(const it of D.itens){
    let varTxt;
    if(it.status==='novo')varTxt='<span style="color:#2563eb;font-weight:700">novo no top</span>';
    else if(it.status==='subiu')varTxt='<span class="up">▲ '+it.delta+'</span>';
    else if(it.status==='caiu')varTxt='<span class="down">▼ '+Math.abs(it.delta)+'</span>';
    else varTxt='<span style="color:#94a3b8">estável</span>';
    const kwHtml=it.url?('<a href="'+it.url+'" target="_blank" rel="noopener" style="color:inherit;text-decoration:none">'+it.keyword+'</a>'):it.keyword;
    h+='<tr><td>'+it.ranking+'</td><td class="m">'+kwHtml+'</td><td>'+varTxt+'</td></tr>';
  }
  h+='</tbody></table>';
  h+='</div>';
  return h;
}

function adsEmpresaTroca(cid){adsEmpresaSel=cid;adsCarregar();}
function htmlAds(){
  let h='<div class="cli">';
  h+='<h2>Product Ads — detalhe por campanha</h2>';
  h+='<div class="sub">Semana mais recente coletada por conta, com histórico curto (até 8 semanas) por campanha. ROAS = receita direta atribuída ao ads ÷ custo do ads.</div>';
  h+='<div style="display:flex;gap:8px;flex-wrap:wrap;margin:14px 0">';
  h+='<button class="curva-chip'+(adsEmpresaSel==='todas'?' on':'')+'" onclick="adsEmpresaTroca(\'todas\')">Todas</button>';
  for(const e of (CURVA_EMPRESAS||[])){h+='<button class="curva-chip'+(adsEmpresaSel===e.cliente_id?' on':'')+'" onclick="adsEmpresaTroca(\''+e.cliente_id+'\')">'+e.nome+'</button>';}
  h+='</div>';
  if(!ADS_CACHE){h+='<div class="empty">Carregando…</div></div>';return h;}
  const D=ADS_CACHE;
  const P=function(v){return 'R$ '+cf.format(Number(v)||0);};
  if(!D.resumo||!D.campanhas||!D.campanhas.length){h+='<div class="empty">Sem campanhas de Product Ads pra essa seleção.</div></div>';return h;}
  h+='<div class="curva-cards">';
  h+='<div class="curva-card"><div class="lbl">Investimento (semana)</div><div class="val">'+P(D.resumo.custo_total)+'</div></div>';
  h+='<div class="curva-card"><div class="lbl">Receita direta (ads)</div><div class="val">'+P(D.resumo.receita_direta_total)+'</div></div>';
  h+='<div class="curva-card"><div class="lbl">ROAS geral</div><div class="val">'+(D.resumo.roas_geral!=null?D.resumo.roas_geral.toFixed(2).replace('.',',')+'x':'—')+'</div></div>';
  h+='<div class="curva-card"><div class="lbl">CTR geral</div><div class="val">'+(D.resumo.ctr_geral!=null?D.resumo.ctr_geral.toFixed(2).replace('.',',')+'%':'—')+'</div></div>';
  h+='</div>';
  h+='<div style="overflow-x:auto"><table style="table-layout:auto;min-width:1180px"><thead><tr><th class="m" style="min-width:170px">Campanha</th><th style="min-width:130px">Empresa/Conta</th><th style="min-width:70px">Status</th><th style="min-width:90px">Custo</th><th style="min-width:70px">Cliques</th><th style="min-width:80px">Impr.</th><th style="min-width:60px">CTR</th><th style="min-width:70px">CPC</th><th style="min-width:100px">Receita direta</th><th style="min-width:80px">Vendas ads</th><th style="min-width:70px">ROAS</th><th style="min-width:110px">Tendência (8 sem.)</th></tr></thead><tbody>';
  for(const c of D.campanhas){
    const spark=(c.historico||[]).map(function(hh){return hh.cost;});
    const maxSpark=Math.max.apply(null,spark.concat([1]));
    let sparkHtml='<div style="display:flex;gap:2px;align-items:flex-end;height:22px">';
    for(const v of spark){sparkHtml+='<div style="width:5px;background:#93c5fd;height:'+Math.max(2,(v/maxSpark)*22)+'px" title="R$ '+cf.format(v)+'"></div>';}
    sparkHtml+='</div>';
    h+='<tr><td class="m">'+(c.campaign_name||c.campaign_id)+'</td><td>'+c.cliente_nome+' / '+c.conta_apelido+'</td><td>'+(c.status||'—')+'</td>';
    h+='<td>'+P(c.cost)+'</td><td>'+nf.format(c.clicks)+'</td><td>'+nf.format(c.prints)+'</td>';
    h+='<td>'+(c.ctr!=null?c.ctr.toFixed(2).replace('.',',')+'%':'—')+'</td><td>'+(c.cpc!=null?P(c.cpc):'—')+'</td>';
    h+='<td>'+P(c.direct_amount)+'</td><td>'+nf.format(c.direct_units_quantity)+'</td>';
    h+='<td style="'+(c.roas!=null&&c.roas<3?'color:#dc2626':'color:#16a34a')+'">'+(c.roas!=null?c.roas.toFixed(2).replace('.',',')+'x':'—')+'</td>';
    h+='<td>'+sparkHtml+'</td></tr>';
  }
  h+='</tbody></table></div>';
  h+='<div class="foot" style="text-align:left;margin-top:10px">ROAS abaixo de 3x em vermelho — critério nosso (ajustável conforme sua margem real: se sua margem bruta é X%, o ROAS mínimo pra não ter prejuízo com ads é aproximadamente 1/X).</div>';
  h+='</div>';
  return h;
}

function selKey(){return [...SELT].sort().join('|');}
function empFull(cid){return SELT.size===0||SELT.has('cli:'+cid);}
function contaVis(cid,ap){return SELT.size===0||SELT.has('cli:'+cid)||SELT.has(ap);}
function toggleTag(t){if(SELT.has(t))SELT.delete(t);else SELT.add(t);montaFiltro();montaPeriodos();render();}
function limparTags(){SELT.clear();montaFiltro();montaPeriodos();render();}
function montaFiltro(){
  const bar=document.getElementById("tagbar");if(!bar)return;
  const clientes={};
  for(const r of DADOS.conta){(clientes[r.cliente_id]=clientes[r.cliente_id]||{nome:r.cliente,contas:new Set()}).contas.add(r.conta);}
  let h='<span class="taglbl">Empresas:</span>';
  for(const cid in clientes){h+='<button class="chip'+(SELT.has("cli:"+cid)?" on":"")+'" data-tok="cli:'+cid+'">'+clientes[cid].nome+'</button>';}
  h+='<span class="taglbl">Contas:</span>';
  for(const cid in clientes){[...clientes[cid].contas].sort().forEach(function(c){h+='<button class="chip c'+(SELT.has(c)?" on":"")+'" data-tok="'+c+'">'+c+'</button>';});}
  h+='<button class="chip clr" data-clr="1"'+(SELT.size?'':' style="display:none"')+'>× limpar filtro</button>';
  bar.innerHTML=h;
  bar.onclick=function(e){var el=e.target.closest("button");if(!el)return;if(el.dataset.clr){limparTags();}else if(el.dataset.tok){toggleTag(el.dataset.tok);}};
}

function exportarPDF(){
  const abaTxt=aba==='mensal'?'Mensal':'Semanal';
  let filtroTxt='Todas as empresas/contas';
  if(SELT.size){
    const cli={}; for(const r of DADOS.conta){cli[r.cliente_id]=r.cliente;}
    filtroTxt=[...SELT].map(function(t){return t.indexOf('cli:')===0?(cli[t.slice(4)]||t):t;}).join(', ');
  }
  const d=new Date();
  const dt=String(d.getDate()).padStart(2,'0')+'/'+String(d.getMonth()+1).padStart(2,'0')+'/'+d.getFullYear();
  document.getElementById('printhdr').innerHTML='<h1 style="margin:0;font-size:18px;color:#1F4E79">DRE · Acompanhamento Mercado Livre</h1><div style="font-size:12px;color:#555;margin-top:2px">Visão '+abaTxt+' · Filtro: '+filtroTxt+' · Gerado em '+dt+'</div>';
  const ot=document.title; document.title='DRE '+abaTxt+' '+dt.split('/').join('-');
  window.print();
  setTimeout(function(){document.title=ot;},800);
}
function montaPeriodos(){
  const all=todosPeriodos();const sel=periodosAtivos();const menu=document.getElementById("menuPeriodos");
  let h=`<label style="font-weight:600;border-bottom:1px solid var(--line)"><input type="checkbox" id="pTodos"> Mostrar todos</label>`;
  for(const p of [...all].reverse()) h+=`<label><input type="checkbox" class="pchk" value="${p}" ${sel.includes(p)?"checked":""}> ${labelPeriodo(p)}</label>`;
  menu.innerHTML=h;
  menu.querySelectorAll(".pchk").forEach(c=>c.onchange=()=>{periodosSel=[...menu.querySelectorAll(".pchk:checked")].map(x=>x.value);if(!periodosSel.length)periodosSel=all.slice(-PADRAO);render();});
  document.getElementById("pTodos").onchange=(e)=>{periodosSel=e.target.checked?all.slice():all.slice(-PADRAO);montaPeriodos();render();};
}
async function load(){
  document.getElementById("app").innerHTML=`<div class="empty">Carregando…</div>`;
  try{
    const {data:{session}}=await sb.auth.getSession();
    const r=await fetch(API,{cache:"no-store",headers:{Authorization:"Bearer "+(session?.access_token||"")}});
    if(r.status===401){ mostrarLogin(); return; }
    DADOS=await r.json();
    montaFiltro();trocaAba(aba);
    document.querySelector("#subtitulo").insertAdjacentHTML("beforeend",` <span class="pill">atualizado ${new Date().toLocaleString("pt-BR",{timeZone:"America/Sao_Paulo"})}</span>`);
  }catch(e){ document.getElementById("app").innerHTML=`<div class="empty">Erro ao carregar os dados.<br>${e}</div>`; }
}
async function atualizar(){
  const btn=document.getElementById("btnAtualizar");btn.disabled=true;const txt=btn.textContent;btn.textContent="Atualizando…";
  document.getElementById("app").innerHTML=`<div class="empty">Buscando dados novos direto do Mercado Livre…<br>Isso pode levar até ~30s por conta. Não feche a página.</div>`;
  try{const {data:{session:_s}}=await sb.auth.getSession();await fetch(COLETOR,{cache:"no-store",headers:{Authorization:"Bearer "+(_s?.access_token||"")}});}catch(e){}
  await load();
  btn.disabled=false;btn.textContent=txt;
}
async function fecharMes(){
  var btn=document.getElementById("btnFecharMes");
  var now=new Date(new Date().toLocaleString("en-US",{timeZone:"America/Sao_Paulo"}));
  var y=now.getFullYear(), m=now.getMonth(); if(m===0){y--;m=12;}
  var def=y+"-"+String(m).padStart(2,"0");
  var mes=prompt("Fechar qual mes? (formato AAAA-MM) Ex.: mes passado = "+def, def);
  if(!mes) return;
  if(!/^[0-9]{4}-[0-9]{2}$/.test(mes)){ alert("Formato invalido. Use AAAA-MM, ex.: 2026-06"); return; }
  var contas=[...new Map((DADOS.conta||[]).map(function(r){return [r.conta_id,r.conta];})).entries()];
  if(!contas.length){ alert("Nenhuma conta carregada."); return; }
  var ses=await sb.auth.getSession(); var tok=(ses.data.session&&ses.data.session.access_token)||"";
  btn.disabled=true; var t0=btn.textContent; btn.textContent="Fechando...";
  var app=document.getElementById("app");
  var done=0, okc=0; var fail=[];
  for(var i=0;i<contas.length;i++){
    var id=contas[i][0], nome=contas[i][1]; done++;
    app.innerHTML='<div class="empty">Fechando '+mes+' no Mercado Livre... '+done+'/'+contas.length+' - '+nome+'<br>Nao feche a pagina.</div>';
    try{
      var r=await fetch(SB_URL+"/functions/v1/ml-fechar-mes?mes="+mes+"&conta_id="+id,{method:"POST",cache:"no-store",headers:{Authorization:"Bearer "+tok}});
      var j=await r.json(); var row=j&&j.resultados&&j.resultados[0];
      if(row&&row.ok) okc++; else fail.push(nome);
    }catch(e){ fail.push(nome); }
  }
  await load(); aba="mensal"; trocaAba("mensal");
  btn.disabled=false; btn.textContent=t0;
  alert("Mes "+mes+" fechado: "+okc+" conta(s) OK"+(fail.length?("\nSem dados/erro: "+fail.join(", ")):""));
}

(async()=>{ const {data:{session}}=await sb.auth.getSession(); if(session) mostrarApp(); else mostrarLogin(); })();
